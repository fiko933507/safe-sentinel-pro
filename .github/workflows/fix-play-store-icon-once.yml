name: Repair Play Store Icon Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-play-store-icon-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Convert logo to true square PNG with safe padding
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import math

          path = Path('frontend/assets/yenilogo.png')
          image = Image.open(path)
          image.load()
          image = image.convert('RGBA')
          width, height = image.size
          content_side = max(width, height)
          canvas_side = max(512, int(math.ceil(content_side / 0.76)))
          canvas = Image.new('RGBA', (canvas_side, canvas_side), (0, 0, 0, 0))
          x = (canvas_side - width) // 2
          y = (canvas_side - height) // 2
          canvas.alpha_composite(image, (x, y))
          canvas.save(path, format='PNG', optimize=True)

          check = Image.open(path)
          check.load()
          assert check.format == 'PNG', check.format
          assert check.width == check.height, check.size
          print(f'Icon repaired: PNG {check.width}x{check.height}')
          PY
      - name: Verify image type
        run: |
          file frontend/assets/yenilogo.png
          file frontend/assets/yenilogo.png | grep -q 'PNG image data'
      - name: Commit repaired icon
        run: |
          if git diff --quiet -- frontend/assets/yenilogo.png; then
            echo "Icon already valid"
            exit 0
          fi
          git config user.name "safe-sentinel-ci"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/assets/yenilogo.png
          git commit -m "Fix Android launcher image asset"
          git pull --rebase origin main
          git push
