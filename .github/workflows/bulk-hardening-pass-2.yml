name: Bulk Production Hardening Pass 2

on:
  push:
    paths:
      - '.github/workflows/bulk-hardening-pass-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply dashboard navigation cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend/App.js')
          s = p.read_text(encoding='utf-8')

          state_anchor = "  const [apiOnline, setApiOnline] = useState(false);\n"
          if state_anchor not in s:
              raise SystemExit('apiOnline state anchor not found')
          s = s.replace(
              state_anchor,
              state_anchor + "  const [profileMenuOpen, setProfileMenuOpen] = useState(false);\n",
              1
          )

          # Replace the old three large dashboard buttons (Wallet / Settings / Logout)
          # with a compact Profile + Notifications toolbar and an expandable profile menu.
          pattern = re.compile(r'''\s*<View\n\s*style=\{\{\n\s*flexDirection: "row",\n\s*flexWrap: "wrap",\n\s*gap: 6,\n\s*marginTop: 8\n\s*\}\}>\n\n\s*<TouchableOpacity\n\s*onPress=\{\(\) => setActiveModule\("vaultView"\)\}[\s\S]*?\{t\("dashboardLogout"\)\}[\s\S]*?</TouchableOpacity>\n\s*</View>''')

          replacement = r'''
              <View
                style={{
                  flexDirection: 'row',
                  justifyContent: 'space-between',
                  alignItems: 'center',
                  marginTop: 8,
                  marginBottom: 10
                }}>
                <TouchableOpacity
                  onPress={() => setProfileMenuOpen((prev) => !prev)}
                  activeOpacity={0.82}
                  style={{
                    flexDirection: 'row',
                    alignItems: 'center',
                    backgroundColor: theme.inputBg,
                    borderColor: theme.borderCol,
                    borderWidth: 1,
                    borderRadius: 10,
                    paddingHorizontal: 12,
                    paddingVertical: 8,
                    maxWidth: '72%'
                  }}>
                  <Text style={{ color: theme.primary, fontSize: 15, marginRight: 7 }}>●</Text>
                  <View style={{ flexShrink: 1 }}>
                    <Text numberOfLines={1} style={{ color: theme.textMain, fontSize: 10, fontWeight: '900' }}>
                      {name || (selectedLanguage === 'tr' ? 'Profil' : 'Profile')}
                    </Text>
                    <Text style={{ color: theme.textSub, fontSize: 8 }}>
                      {userStatus === 'vip' ? 'VIP' : (selectedLanguage === 'tr' ? 'Standart' : 'Standard')}
                    </Text>
                  </View>
                </TouchableOpacity>

                <TouchableOpacity
                  onPress={() => {
                    setProfileMenuOpen(false);
                    setActiveModule('notificationsView');
                  }}
                  activeOpacity={0.82}
                  style={{
                    minWidth: 48,
                    height: 40,
                    backgroundColor: theme.inputBg,
                    borderColor: theme.borderCol,
                    borderWidth: 1,
                    borderRadius: 10,
                    alignItems: 'center',
                    justifyContent: 'center'
                  }}>
                  <Text style={{ color: theme.textMain, fontSize: 18 }}>🔔</Text>
                  {centralUnreadCount > 0 ?
                    <View style={{
                      position: 'absolute',
                      right: -4,
                      top: -5,
                      minWidth: 18,
                      height: 18,
                      borderRadius: 9,
                      backgroundColor: '#EF4444',
                      alignItems: 'center',
                      justifyContent: 'center',
                      paddingHorizontal: 4
                    }}>
                      <Text style={{ color: '#FFFFFF', fontSize: 8, fontWeight: '900' }}>
                        {centralUnreadCount > 99 ? '99+' : centralUnreadCount}
                      </Text>
                    </View> : null}
                </TouchableOpacity>
              </View>

              {profileMenuOpen ?
                <View style={{
                  backgroundColor: theme.inputBg,
                  borderColor: theme.borderCol,
                  borderWidth: 1,
                  borderRadius: 10,
                  padding: 8,
                  marginBottom: 10
                }}>
                  <TouchableOpacity onPress={() => { setProfileMenuOpen(false); setActiveModule('vaultView'); }} style={{ paddingVertical: 9, paddingHorizontal: 8 }}>
                    <Text style={{ color: theme.textMain, fontSize: 10, fontWeight: '800' }}>
                      {selectedLanguage === 'tr' ? 'Cüzdan / Kasa' : 'Wallet / Vault'}
                    </Text>
                  </TouchableOpacity>
                  <TouchableOpacity onPress={() => { setProfileMenuOpen(false); setActiveModule('preferencesView'); }} style={{ paddingVertical: 9, paddingHorizontal: 8, borderTopWidth: 1, borderTopColor: theme.borderCol }}>
                    <Text style={{ color: theme.textMain, fontSize: 10, fontWeight: '800' }}>
                      {selectedLanguage === 'tr' ? 'Ayarlar' : 'Settings'}
                    </Text>
                  </TouchableOpacity>
                  <TouchableOpacity onPress={() => { setProfileMenuOpen(false); handleLogout(); }} style={{ paddingVertical: 9, paddingHorizontal: 8, borderTopWidth: 1, borderTopColor: theme.borderCol }}>
                    <Text style={{ color: '#EF4444', fontSize: 10, fontWeight: '900' }}>
                      {selectedLanguage === 'tr' ? 'Çıkış' : 'Sign Out'}
                    </Text>
                  </TouchableOpacity>
                </View> : null}
'''

          s2, count = pattern.subn(replacement, s, count=1)
          print('dashboard old action row replacements:', count)
          if count != 1:
              raise SystemExit('Could not locate old dashboard Wallet/Settings/Logout row')
          s = s2

          # Keep language in Settings: no dashboard language shortcut is introduced.
          # Make notification title cleaner in both languages where literal values exist.
          s = s.replace('Bildirimler ve Dolandırıcılık Uyarıları', 'Bildirimler')
          s = s.replace('Notifications & Scam Alerts', 'Notifications')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check frontend/App.js
      - name: Commit dashboard hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/App.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Compact dashboard profile and notifications navigation"
          git push origin HEAD:main
