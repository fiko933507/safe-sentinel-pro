name: Field Smoke Production Hardening

on:
  push:
    paths:
      - '.github/workflows/field-smoke-production-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply real-device smoke-test fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend/App.js')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label, required=True):
              global s
              if old not in s:
                  if required:
                      raise SystemExit(f'{label}: anchor not found')
                  print(f'{label}: already applied or anchor absent')
                  return
              s = s.replace(old, new, 1)
              print(f'{label}: applied')

          # Play Store build must not expose direct crypto payment UI.
          if "const IS_PLAY_STORE_BUILD" not in s:
              rep(
                  "const API_BASE_URL = BACKEND_URL;\n",
                  "const API_BASE_URL = BACKEND_URL;\nconst IS_PLAY_STORE_BUILD = process.env.EXPO_PUBLIC_PLAY_STORE_BUILD === 'true';\n",
                  'play-store-build-flag'
              )

          # Product naming / truthful terminology.
          replacements = {
              "toolTitlePortfolio: 'Portföy Değer Grafikleri (Kasa Varlıkları)'": "toolTitlePortfolio: 'Cüzdan Portföyü'",
              "dashboardViewVaultAssets: 'Kasa varlıklarını görüntüle'": "dashboardViewVaultAssets: 'Taranan cüzdan varlıklarını görüntüle'",
              "dashboardGasOptimization: 'Gas Optimizasyonu'": "dashboardGasOptimization: 'Ağ İşlem Ücretleri'",
              "toolTitleGasOpt: 'Web3 Gas Optimizasyonu'": "toolTitleGasOpt: 'Ağ İşlem Ücretleri'",
              "toolTitleBehavioral: 'AI Cüzdan Davranış Analizi'": "toolTitleBehavioral: 'Cüzdan Davranış Analizi'",
              "behaviorDescription: 'Yapay zeka motoru ile cüzdanın davranışsal profilini çıkarın.'": "behaviorDescription: 'Gerçek zincir verilerinden cüzdanın davranışsal risk profilini çıkarın.'",
              "toolTitleGuardian: 'Safe Sentinel Guardian — Akıllı Cüzdan Koruma Merkezi'": "toolTitleGuardian: 'Guardian — Akıllı Cüzdan Koruma'",
              "dashboardSafeAddresses: 'GÜVENLİ ADRESLER'": "dashboardSafeAddresses: 'WHITELIST'",
              "dashboardBlockedAddresses: 'ENGELLENEN ADRESLER'": "dashboardBlockedAddresses: 'BLACKLIST'",
              "toolTitlePortfolio: 'Portfolio Value Charts (Vault Assets)'": "toolTitlePortfolio: 'Wallet Portfolio'",
              "dashboardViewVaultAssets: 'View vault assets'": "dashboardViewVaultAssets: 'View scanned wallet assets'",
              "dashboardGasOptimization: 'Gas Optimization'": "dashboardGasOptimization: 'Network Fees'",
              "toolTitleGasOpt: 'Web3 Gas Optimization'": "toolTitleGasOpt: 'Network Fees'",
              "toolTitleOutboundShield: 'Risky Transaction / Transfer Shield'": "toolTitleOutboundShield: 'Transfer Shield'",
              "toolTitleSmartContract: 'Smart Contract & AI Threat Radar'": "toolTitleSmartContract: 'Smart Contract Security Analysis'",
              "toolTitleBehavioral: 'AI Wallet Behavior Analysis'": "toolTitleBehavioral: 'Wallet Behavior Analysis'",
              "behaviorDescription: 'Generate a behavioral profile of the wallet using the AI engine.'": "behaviorDescription: 'Generate a behavioral risk profile from live on-chain wallet data.'",
              "toolTitleGuardian: 'Safe Sentinel Guardian — Smart Wallet Protection Center'": "toolTitleGuardian: 'Guardian — Smart Wallet Protection'",
              "toolTitleInheritance: \"Crypto Asset Inheritance (Dead Man's Switch)\"": "toolTitleInheritance: 'Crypto Asset Inheritance'",
              "dashboardSafeAddressesTitle: 'Safe Addresses'": "dashboardSafeAddressesTitle: 'Whitelist'",
              "dashboardBlockedAddressesTitle: 'Blocked Addresses'": "dashboardBlockedAddressesTitle: 'Blacklist'",
              "dashboardSafeAddresses: 'SAFE ADDRESSES'": "dashboardSafeAddresses: 'WHITELIST'",
              "dashboardBlockedAddresses: 'BLOCKED ADDRESSES'": "dashboardBlockedAddresses: 'BLACKLIST'",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)

          # Compact dashboard navigation: profile left, notifications right.
          if "const [profileMenuOpen, setProfileMenuOpen]" not in s:
              rep(
                  "  const [apiOnline, setApiOnline] = useState(false);\n",
                  "  const [apiOnline, setApiOnline] = useState(false);\n  const [profileMenuOpen, setProfileMenuOpen] = useState(false);\n",
                  'profile-state'
              )

          nav_pattern = re.compile(r'''\n\s*<View\n\s*style=\{\{\n\s*flexDirection: "row",\n\s*flexWrap: "wrap",\n\s*gap: 6,\n\s*marginTop: 8\n\s*\}\}>\n\n\s*<TouchableOpacity\n\s*onPress=\{\(\) => setActiveModule\("vaultView"\)\}[\s\S]*?\{t\("dashboardLogout"\)\}[\s\S]*?</TouchableOpacity>\n\s*</View>''')
          nav_replacement = r'''
              <View style={{ flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center', marginTop: 8, marginBottom: 10 }}>
                <TouchableOpacity
                  onPress={() => setProfileMenuOpen((prev) => !prev)}
                  activeOpacity={0.82}
                  style={{ flexDirection: 'row', alignItems: 'center', backgroundColor: theme.inputBg, borderColor: theme.borderCol, borderWidth: 1, borderRadius: 10, paddingHorizontal: 12, paddingVertical: 8, maxWidth: '76%' }}>
                  <Text style={{ color: theme.primary, fontSize: 17, marginRight: 8 }}>◉</Text>
                  <View style={{ flexShrink: 1 }}>
                    <Text numberOfLines={1} style={{ color: theme.textMain, fontSize: 10, fontWeight: '900' }}>{name || (selectedLanguage === 'tr' ? 'Profil' : 'Profile')}</Text>
                    <Text style={{ color: theme.textSub, fontSize: 8 }}>{userStatus === 'vip' ? 'VIP' : (selectedLanguage === 'tr' ? 'Standart' : 'Standard')}</Text>
                  </View>
                </TouchableOpacity>
                <TouchableOpacity
                  onPress={() => { setProfileMenuOpen(false); setActiveModule('notificationsView'); }}
                  activeOpacity={0.82}
                  style={{ width: 44, height: 40, backgroundColor: theme.inputBg, borderColor: theme.borderCol, borderWidth: 1, borderRadius: 10, alignItems: 'center', justifyContent: 'center' }}>
                  <Text style={{ color: theme.textMain, fontSize: 17 }}>🔔</Text>
                  {centralUnreadCount > 0 ?
                    <View style={{ position: 'absolute', right: -4, top: -5, minWidth: 18, height: 18, borderRadius: 9, backgroundColor: '#EF4444', alignItems: 'center', justifyContent: 'center', paddingHorizontal: 4 }}>
                      <Text style={{ color: '#FFFFFF', fontSize: 8, fontWeight: '900' }}>{centralUnreadCount > 99 ? '99+' : centralUnreadCount}</Text>
                    </View> : null}
                </TouchableOpacity>
              </View>
              {profileMenuOpen ?
                <View style={{ backgroundColor: theme.inputBg, borderColor: theme.borderCol, borderWidth: 1, borderRadius: 10, padding: 8, marginBottom: 10 }}>
                  <TouchableOpacity onPress={() => { setProfileMenuOpen(false); setActiveModule('vaultView'); }} style={{ paddingVertical: 9, paddingHorizontal: 8 }}>
                    <Text style={{ color: theme.textMain, fontSize: 10, fontWeight: '800' }}>{selectedLanguage === 'tr' ? 'Cüzdan / Kasa' : 'Wallet / Vault'}</Text>
                  </TouchableOpacity>
                  <TouchableOpacity onPress={() => { setProfileMenuOpen(false); setActiveModule('preferencesView'); }} style={{ paddingVertical: 9, paddingHorizontal: 8, borderTopWidth: 1, borderTopColor: theme.borderCol }}>
                    <Text style={{ color: theme.textMain, fontSize: 10, fontWeight: '800' }}>{selectedLanguage === 'tr' ? 'Ayarlar' : 'Settings'}</Text>
                  </TouchableOpacity>
                  <TouchableOpacity onPress={() => { setProfileMenuOpen(false); handleLogout(); }} style={{ paddingVertical: 9, paddingHorizontal: 8, borderTopWidth: 1, borderTopColor: theme.borderCol }}>
                    <Text style={{ color: '#EF4444', fontSize: 10, fontWeight: '900' }}>{selectedLanguage === 'tr' ? 'Çıkış' : 'Sign Out'}</Text>
                  </TouchableOpacity>
                </View> : null}
'''
          s2, n = nav_pattern.subn(nav_replacement, s, count=1)
          if n:
              s = s2
              print('dashboard-nav: applied')
          else:
              print('dashboard-nav: already applied or anchor changed')

          # Whitelist / blacklist canonical object handling, backend delete, and conflict prevention.
          list_pattern = re.compile(r'''  const removeFromWhitelist = async \([\s\S]*?\n  const addToVault = \(\) => \{''')
          list_handlers = '''  const removeFromWhitelist = async (entry) => {
    try {
      const cleanAddr = SecurityScannerMiddleware.sanitizeInput(String(entry?.address || entry || '').trim());
      const matched = whitelist.find((item) => String(item?.address || item || '').trim().toLowerCase() === cleanAddr.toLowerCase());
      if (!matched) return Alert.alert(t('commonInfoTitle'), t('whitelistNotFound'));
      if (matched?.id) await api.delete(`/api/whitelist/${matched.id}`);
      await syncSecurityAddressLists();
      Alert.alert(t('commonSuccessTitle'), t('whitelistRemoved'));
    } catch (e) {
      handleIsolatedError('Whitelist Silme', e);
      Alert.alert(t('commonErrorTitle'), selectedLanguage === 'tr' ? 'Whitelist kaydı kaldırılamadı.' : 'Whitelist entry could not be removed.');
    }
  };

  const removeFromBlacklist = async (entry) => {
    try {
      const cleanAddr = SecurityScannerMiddleware.sanitizeInput(String(entry?.address || entry || '').trim());
      const matched = blacklist.find((item) => String(item?.address || item || '').trim().toLowerCase() === cleanAddr.toLowerCase());
      if (!matched) return Alert.alert(t('commonInfoTitle'), t('blacklistNotFound'));
      if (matched?.id) await api.delete(`/api/blacklist/${matched.id}`);
      await syncSecurityAddressLists();
      Alert.alert(t('commonSuccessTitle'), t('blacklistRemoved'));
    } catch (e) {
      handleIsolatedError('Blacklist Silme', e);
      Alert.alert(t('commonErrorTitle'), selectedLanguage === 'tr' ? 'Blacklist kaydı kaldırılamadı.' : 'Blacklist entry could not be removed.');
    }
  };

  const addToWhitelist = async () => {
    const cleanAddr = address ? SecurityScannerMiddleware.sanitizeInput(address) : '';
    if (!cleanAddr) return Alert.alert(t('commonErrorTitle'), t('commonAddressRequired'));
    if (securityListContains(blacklist, cleanAddr, selectedNetwork)) return Alert.alert(t('commonConflictTitle'), t('whitelistConflict'));
    if (securityListContains(whitelist, cleanAddr, selectedNetwork)) return Alert.alert(t('commonInfoTitle'), t('whitelistAlready'));
    try {
      await saveWhitelist([...whitelist, { address: cleanAddr, network: selectedNetwork === 'eth' ? 'ethereum' : selectedNetwork }]);
      await syncSecurityAddressLists();
      Alert.alert(t('commonSuccessTitle'), t('whitelistAdded'));
    } catch (e) { handleIsolatedError('Whitelist Ekleme', e); }
  };

  const addToBlacklist = async () => {
    const cleanAddr = address ? SecurityScannerMiddleware.sanitizeInput(address) : '';
    if (!cleanAddr) return Alert.alert(t('commonErrorTitle'), t('commonAddressRequired'));
    if (securityListContains(whitelist, cleanAddr, selectedNetwork)) return Alert.alert(t('commonConflictTitle'), t('blacklistConflict'));
    if (securityListContains(blacklist, cleanAddr, selectedNetwork)) return Alert.alert(t('commonInfoTitle'), t('blacklistAlready'));
    try {
      await saveBlacklist([...blacklist, { address: cleanAddr, network: selectedNetwork === 'eth' ? 'ethereum' : selectedNetwork }]);
      await syncSecurityAddressLists();
      Alert.alert(t('commonSuccessTitle'), t('blacklistRiskAdded'));
    } catch (e) { handleIsolatedError('Blacklist Ekleme', e); }
  };

  const addToVault = () => {'''
          s2, n = list_pattern.subn(list_handlers, s, count=1)
          if n:
              s = s2
              print('security-lists: applied')
          else:
              print('security-lists: anchor not found')
          s = s.replace('{addr}\n                      </Text>', "{String(addr?.address || addr || '')}{addr?.network ? `  •  ${String(addr.network).toUpperCase()}` : ''}\n                      </Text>")

          # Price-alert symbol <-> backend asset IDs.
          marker = "  const formatCurrency = (usdValue) =>\n  v26FormatCurrency(usdValue, selectedCurrency);\n"
          if 'PRICE_ALERT_SYMBOL_TO_ASSET' not in s and marker in s:
              s = s.replace(marker, marker + '''\n  const PRICE_ALERT_SYMBOL_TO_ASSET = {\n    TRX: 'tron', SOL: 'solana', BTC: 'bitcoin', AVAX: 'avalanche-2',\n    ARB: 'arbitrum', POL: 'polygon-ecosystem-token', ETH: 'ethereum',\n    BNB: 'binancecoin', PI: 'pi-network'\n  };\n  const PRICE_ALERT_ASSET_TO_SYMBOL = Object.fromEntries(\n    Object.entries(PRICE_ALERT_SYMBOL_TO_ASSET).map(([symbol, asset]) => [asset, symbol])\n  );\n''', 1)
          s = s.replace("crypto: String(item.asset || '').toUpperCase(),", "crypto: PRICE_ALERT_ASSET_TO_SYMBOL[String(item.asset || '').toLowerCase()] || String(item.asset || '').toUpperCase(),")
          s = s.replace("{Object.keys(NETWORKS).filter((key) => key !== 'nft').map((key) => {", "{Object.keys(NETWORKS).filter((key) => key !== 'nft' && PRICE_ALERT_SYMBOL_TO_ASSET[NETWORKS[key].symbol]).map((key) => {")
          s = s.replace("asset: alertTargetCrypto.toLowerCase(),", "asset: PRICE_ALERT_SYMBOL_TO_ASSET[alertTargetCrypto],")
          s = s.replace("error?.response?.data?.error || t(\"priceBackendSaveFailed\")", "error?.response?.data?.error === 'Unsupported price alert asset.' ? (selectedLanguage === 'tr' ? 'Bu varlık için fiyat alarmı şu anda desteklenmiyor.' : 'Price alerts are not supported for this asset yet.') : t(\"priceBackendSaveFailed\")")
          old_delete = "onPress={() => setSavedPriceAlerts(savedPriceAlerts.filter((a) => a.id !== item.id))}"
          new_delete = "onPress={async () => { try { await api.delete(`/api/price-alerts/${item.id}`); await loadPriceAlerts(); } catch (error) { Alert.alert(t('priceSaveFailed'), selectedLanguage === 'tr' ? 'Fiyat alarmı silinemedi.' : 'Price alert could not be deleted.'); } }}"
          s = s.replace(old_delete, new_delete)

          # Transfer Shield: explicit network picker + local list context in result.
          old_risk = '''      const riskLevel =
      matched ?
      "Çok Yüksek" :
      "Belirlenemedi";

      const actionTaken =
      matched ?
      "Bu adres scam istihbaratında eşleşti. Transferi göndermeden önce durdurun ve adresi tekrar doğrulayın." :
      "Adres mevcut scam istihbaratıyla eşleşmedi. Bu sonuç adresin tamamen güvenli olduğu anlamına gelmez.";

      setOutboundCheckResult({
        status: matched ?
        "⚠️ TRANSFER ENGELLENMELİ" :
        " SCAM EŞLEŞMESİ YOK",'''
          new_risk = '''      const inWhitelist = securityListContains(whitelist, cleanRecipient, selectedNetwork);
      const inBlacklist = securityListContains(blacklist, cleanRecipient, selectedNetwork);
      const riskLevel = inBlacklist ? "Çok Yüksek" : matched ? "Çok Yüksek" : inWhitelist ? "Liste Onaylı" : "Belirlenemedi";
      const actionTaken = inBlacklist ?
      "Bu adres kişisel Blacklist listenizde. Transferi göndermeden önce adresi yeniden doğrulayın." :
      matched ?
      "Bu adres scam istihbaratında eşleşti. Transferi göndermeden önce durdurun ve adresi tekrar doğrulayın." :
      inWhitelist ?
      "Bu adres kişisel Whitelist listenizde. Whitelist kaydı zincir üstü güvenlik garantisi değildir." :
      "Adres mevcut scam istihbaratıyla eşleşmedi. Bu sonuç adresin tamamen güvenli olduğu anlamına gelmez.";

      setOutboundCheckResult({
        network: backendNetwork,
        listStatus: inBlacklist ? 'BLACKLIST' : inWhitelist ? 'WHITELIST' : null,
        status: inBlacklist ? "⚠️ BLACKLIST UYARISI" : matched ?
        "⚠️ YÜKSEK RİSK" : inWhitelist ? "WHITELIST KAYDI" :
        "SCAM EŞLEŞMESİ YOK",'''
          if old_risk in s:
              s = s.replace(old_risk, new_risk, 1)
          s = s.replace("isBlocked: matched,", "isBlocked: inBlacklist || matched,", 1)

          outbound_anchor = '''              <View style={[styles.prefCard, { backgroundColor: theme.itemBg, borderColor: theme.borderCol }]}>
                <TextInput
              style={[styles.input, { backgroundColor: theme.inputBg, color: theme.inputTextColor, borderColor: theme.borderCol, marginBottom: 8, height: 36, fontSize: 11 }]}
              placeholder={t("outboundRecipientPlaceholder")}'''
          outbound_new = '''              <View style={[styles.prefCard, { backgroundColor: theme.itemBg, borderColor: theme.borderCol }]}>
                <Text style={{ color: theme.textMain, fontSize: 10, fontWeight: '800', marginBottom: 6 }}>{t('commonNetwork')}</Text>
                <View style={[styles.gridContainer, { marginBottom: 8 }]}>
                  {['tron', 'eth', 'bsc', 'polygon', 'arb', 'avax'].map((key) => {
                    const selected = selectedNetwork === key;
                    return <TouchableOpacity key={`shield-${key}`} onPress={() => setSelectedNetwork(key)} style={{ width: '31%', paddingVertical: 7, marginBottom: 5, borderRadius: 7, alignItems: 'center', backgroundColor: selected ? theme.primary : theme.inputBg, borderWidth: 1, borderColor: selected ? theme.primary : theme.borderCol }}>
                      <Text style={{ color: selected ? '#FFF' : theme.textMain, fontSize: 9, fontWeight: '900' }}>{NETWORKS[key]?.symbol || key.toUpperCase()}</Text>
                    </TouchableOpacity>;
                  })}
                </View>
                <TextInput
              style={[styles.input, { backgroundColor: theme.inputBg, color: theme.inputTextColor, borderColor: theme.borderCol, marginBottom: 8, height: 36, fontSize: 11 }]}
              placeholder={t("outboundRecipientPlaceholder")}'''
          if outbound_anchor in s:
              s = s.replace(outbound_anchor, outbound_new, 1)
          result_line = "<Text style={{ color: theme.textMain, fontSize: 10, marginTop: 2 }}>{t('commonRiskLevel')}: {outboundCheckResult.riskLevel}</Text>"
          if result_line in s:
              s = s.replace(result_line, "<Text style={{ color: theme.textMain, fontSize: 10, marginTop: 2 }}>{t('commonNetwork')}: {String(outboundCheckResult.network || selectedNetwork).toUpperCase()}</Text>\n                    {outboundCheckResult.listStatus ? <Text style={{ color: outboundCheckResult.listStatus === 'BLACKLIST' ? '#EF4444' : '#10B981', fontSize: 10, marginTop: 2 }}>{outboundCheckResult.listStatus}</Text> : null}\n                    " + result_line, 1)

          # Smart Contract networks: responsive 2-column grid instead of horizontal overflow.
          smart_pattern = re.compile(r'''              <ScrollView horizontal showsHorizontalScrollIndicator=\{false\} style=\{\{ marginBottom: 9 \}\}>\n                \{\["ethereum", "bsc", "polygon", "arbitrum", "base", "optimism", "avalanche"\]\.map\(\(key\) =>[\s\S]*?              </ScrollView>''')
          smart_grid = '''              <View style={[styles.gridContainer, { marginBottom: 9 }]}>
                {["ethereum", "bsc", "polygon", "arbitrum", "base", "optimism", "avalanche"].map((key) =>
                  <TouchableOpacity
                    key={key}
                    onPress={() => setContractNetwork(key)}
                    style={{
                      width: '48%',
                      paddingHorizontal: 8,
                      paddingVertical: 8,
                      marginBottom: 6,
                      borderRadius: 8,
                      backgroundColor: contractNetwork === key ? theme.primary : theme.inputBg,
                      borderWidth: 1,
                      borderColor: contractNetwork === key ? theme.primary : theme.borderCol
                    }}>
                    <Text style={{ color: contractNetwork === key ? '#FFF' : theme.textMain, fontSize: 9, fontWeight: '900', textAlign: 'center' }}>
                      {key === 'ethereum' ? 'Ethereum' : key === 'bsc' ? 'BNB Chain' : key === 'polygon' ? 'Polygon' : key === 'arbitrum' ? 'Arbitrum' : key === 'base' ? 'Base' : key === 'optimism' ? 'Optimism' : 'Avalanche'}
                    </Text>
                  </TouchableOpacity>
                )}
              </View>'''
          s, n = smart_pattern.subn(smart_grid, s, count=1)
          print('smart-contract-grid:', n)
          risk_old = '''        riskScore:
        data.riskScore === null ||
        data.riskScore === undefined ?
        "Hesaplanmadı" :
        data.riskScore,'''
          risk_new = '''        riskScore:
        selectedLanguage === 'tr' ?
        'Sınırlı Analiz' :
        'Limited Analysis','''
          if risk_old in s:
              s = s.replace(risk_old, risk_new, 1)

          # Portfolio is the scanned wallet portfolio; Vault remains monitoring only.
          portfolio_pattern = re.compile(r'''        activeModule === 'portfolioView' \?\n[\s\S]*?        activeModule === 'priceAlertsView' \?''')
          portfolio_new = '''        activeModule === 'portfolioView' ?
        <ScrollView contentContainerStyle={styles.prefScrollContainer} showsVerticalScrollIndicator={false}>
          <Text style={styles.prefDescription}>{selectedLanguage === 'tr' ? 'Taranan cüzdanın gerçek zincir üstü bakiyelerini görüntüleyin. Vault, sürekli güvenlik izleme için ayrı bir özelliktir.' : 'View the scanned wallet’s live on-chain balances. Vault is a separate continuous security-monitoring feature.'}</Text>
          {!address || (walletNativeBalance === null && walletTokens.length === 0) ?
            <View style={[styles.prefCard, { backgroundColor: theme.itemBg, borderColor: theme.borderCol, padding: 16 }]}>
              <Text style={{ color: theme.textMain, fontWeight: 'bold', fontSize: 12 }}>{selectedLanguage === 'tr' ? 'Önce bir cüzdan tarayın' : 'Scan a wallet first'}</Text>
              <Text style={{ color: theme.textSub, fontSize: 10, marginTop: 6 }}>{selectedLanguage === 'tr' ? 'Ana ekranda bir cüzdan adresi sorguladığınızda portföy bakiyeleri burada gösterilir.' : 'Portfolio balances will appear here after you scan a wallet on the dashboard.'}</Text>
            </View> :
            <>
              <View style={[styles.prefCard, { backgroundColor: theme.itemBg, borderColor: theme.primary, padding: 14 }]}>
                <Text style={{ color: theme.textSub, fontSize: 9 }}>{t('commonNetwork')}: {NETWORKS[selectedNetwork]?.name || selectedNetwork}</Text>
                <Text selectable numberOfLines={1} style={{ color: theme.textSub, fontSize: 8, marginTop: 4 }}>{address}</Text>
                <Text style={{ color: theme.primary, fontSize: 22, fontWeight: '900', marginTop: 10 }}>{formatCurrency(portfolioUsdValue)}</Text>
                {walletNativeBalance !== null ? <Text style={{ color: theme.textMain, fontSize: 13, fontWeight: '800', marginTop: 7 }}>{Number(walletNativeBalance).toLocaleString('en-US', { maximumFractionDigits: 8 })} {NETWORKS[selectedNetwork]?.symbol || ''}</Text> : null}
                {walletLatestBlock ? <Text style={{ color: theme.textSub, fontSize: 9, marginTop: 5 }}>{t('dashboardLastBlock')}: {walletLatestBlock}</Text> : null}
              </View>
              <View style={[styles.prefCard, { backgroundColor: theme.itemBg, borderColor: theme.borderCol }]}>
                <Text style={{ color: theme.textMain, fontSize: 11, fontWeight: 'bold', marginBottom: 7 }}>{selectedLanguage === 'tr' ? 'Token Bakiyeleri' : 'Token Balances'}</Text>
                {walletTokens.filter((item) => Number(item?.balance || 0) > 0).length === 0 ?
                  <Text style={{ color: theme.textSub, fontSize: 10 }}>{selectedLanguage === 'tr' ? 'Ek token bakiyesi bulunamadı.' : 'No additional token balance found.'}</Text> :
                  walletTokens.filter((item) => Number(item?.balance || 0) > 0).map((item, index) =>
                    <View key={`portfolio-token-${index}`} style={{ flexDirection: 'row', justifyContent: 'space-between', paddingVertical: 6, borderBottomWidth: index === walletTokens.length - 1 ? 0 : 1, borderBottomColor: theme.borderCol }}>
                      <Text style={{ color: theme.textMain, fontSize: 10, fontWeight: '700' }}>{item?.symbol || item?.name || 'TOKEN'}</Text>
                      <Text style={{ color: theme.textSub, fontSize: 10 }}>{Number(item?.balance || 0).toLocaleString('en-US', { maximumFractionDigits: 8 })}</Text>
                    </View>)
                }
              </View>
            </>}
        </ScrollView> :
        activeModule === 'priceAlertsView' ?'''
          s, n = portfolio_pattern.subn(portfolio_new, s, count=1)
          print('portfolio-view:', n)

          # Gas: refresh on entry and show only real returned values, not fake dash rows.
          gas_effect_anchor = '''  useEffect(() => {
    if (activeModule === 'portfolioView') {
      fetchPortfolioData();
    }
  }, [
  activeModule,
  fetchPortfolioData]
  );'''
          if gas_effect_anchor in s and "activeModule === 'gasOptView'" not in s[s.find(gas_effect_anchor):s.find(gas_effect_anchor)+700]:
              s = s.replace(gas_effect_anchor, gas_effect_anchor + '''
  useEffect(() => {
    if (activeModule === 'gasOptView' && token) {
      fetchLiveGasFees();
    }
  }, [activeModule, token, fetchLiveGasFees]);''', 1)
          gas_pattern = re.compile(r'''        activeModule === 'gasOptView' \?\n[\s\S]*?        activeModule === 'deepIntelView' \?''')
          gas_new = '''        activeModule === 'gasOptView' ?
        <ScrollView contentContainerStyle={styles.prefScrollContainer} showsVerticalScrollIndicator={false}>
          <Text style={styles.prefDescription}>{selectedLanguage === 'tr' ? 'Backend RPC kaynaklarından alınabilen gerçek ağ işlem ücretlerini görüntüleyin.' : 'View live network fees available from backend RPC sources.'}</Text>
          {gasLoading ? <Text style={{ color: theme.textSub, fontSize: 10, textAlign: 'center', marginVertical: 12 }}>{selectedLanguage === 'tr' ? 'Ağ ücretleri yükleniyor...' : 'Loading network fees...'}</Text> : null}
          {Object.entries(networkGasFees).filter(([network, fee]) => ['eth','bsc','polygon','arb'].includes(network) && /[0-9]/.test(String(fee))).length === 0 ?
            <View style={[styles.prefCard, { backgroundColor: theme.itemBg, borderColor: '#F59E0B' }]}>
              <Text style={{ color: '#F59E0B', fontSize: 11, fontWeight: 'bold' }}>{selectedLanguage === 'tr' ? 'Canlı ağ ücreti alınamadı' : 'Live network fees unavailable'}</Text>
              <Text style={{ color: theme.textSub, fontSize: 10, marginTop: 5 }}>{selectedLanguage === 'tr' ? 'Boş değerler canlı veri olarak gösterilmez. Daha sonra tekrar deneyin.' : 'Empty values are not presented as live data. Try again later.'}</Text>
              <TouchableOpacity onPress={fetchLiveGasFees} style={[styles.button, { backgroundColor: theme.primary, marginTop: 10, height: 36 }]}><Text style={styles.buttonText}>{selectedLanguage === 'tr' ? 'Yeniden Dene' : 'Retry'}</Text></TouchableOpacity>
            </View> :
            <View style={[styles.prefCard, { backgroundColor: theme.itemBg, borderColor: theme.borderCol }]}>
              <Text style={{ color: theme.primary, fontWeight: 'bold', fontSize: 12, marginBottom: 8 }}>{selectedLanguage === 'tr' ? 'CANLI AĞ ÜCRETLERİ' : 'LIVE NETWORK FEES'}</Text>
              {Object.entries(networkGasFees).filter(([network, fee]) => ['eth','bsc','polygon','arb'].includes(network) && /[0-9]/.test(String(fee))).map(([network, fee]) => <View key={network} style={{ flexDirection: 'row', justifyContent: 'space-between', backgroundColor: theme.inputBg, padding: 8, borderRadius: 6, marginBottom: 5 }}><Text style={{ color: theme.textMain, fontSize: 10, fontWeight: 'bold' }}>{{ eth: 'Ethereum', bsc: 'BNB Chain', polygon: 'Polygon', arb: 'Arbitrum' }[network]}</Text><Text style={{ color: theme.primary, fontSize: 10, fontWeight: 'bold' }}>{fee}</Text></View>)}
              {gasLastUpdated ? <Text style={{ color: theme.textSub, fontSize: 8, marginTop: 5 }}>{selectedLanguage === 'tr' ? 'Son güncelleme' : 'Last updated'}: {gasLastUpdated.toLocaleTimeString()}</Text> : null}
            </View>}
        </ScrollView> :
        activeModule === 'deepIntelView' ?'''
          s, n = gas_pattern.subn(gas_new, s, count=1)
          print('gas-view:', n)

          # V1 dashboard: hide tools proven unavailable/incomplete in field test; source remains intact.
          s = s.replace('''            [t("dashboardVaultAssets"), `${vault.length}/10 ${t("dashboardMonitored")}`, "vaultView", t("dashboardAvailable")],
            ["Guardian", t("dashboardSecurityCircle"), "guardianView", t("dashboardAvailable")]]''', '''            [t("dashboardVaultAssets"), `${vault.length}/10 ${t("dashboardMonitored")}`, "vaultView", t("dashboardAvailable")]]''')
          s = s.replace('''            [t("dashboardPriceAlert"), t("dashboardTrackTargetPrices"), "priceAlertsView"],
            [t("toolTitleAiMarket"), t("dashboardMarketSentimentAnalysis"), "aiMarketView"]].''', '''            [t("dashboardPriceAlert"), t("dashboardTrackTargetPrices"), "priceAlertsView"]].''')
          s = s.replace('''            ["Guardian", t("dashboardSecurityCircle"), "guardianView", t("dashboardAvailable")],
            [t("dashboardCryptoInheritance"), "Dead Man's Switch", "inheritView", t("dashboardAvailable")]].''', '''            ["Guardian", t("dashboardSecurityCircle"), "guardianView", t("dashboardAvailable")]].''')

          # Play Store: intercept VIP screen before crypto-payment branch.
          vip_gate_anchor = "          {activeModule === 'whitelistView' ?\n"
          if vip_gate_anchor in s and "IS_PLAY_STORE_BUILD ?\n        <ScrollView" not in s:
              gate = '''          {activeModule === 'vipView' && IS_PLAY_STORE_BUILD ?
        <ScrollView contentContainerStyle={styles.prefScrollContainer} showsVerticalScrollIndicator={false}>
          <View style={[styles.prefCard, { backgroundColor: theme.itemBg, borderColor: theme.primary, padding: 16 }]}>
            <Text style={{ color: theme.textMain, fontSize: 13, fontWeight: '900' }}>{selectedLanguage === 'tr' ? 'VIP Satın Alma' : 'VIP Purchase'}</Text>
            <Text style={{ color: theme.textSub, fontSize: 10, lineHeight: 16, marginTop: 7 }}>{selectedLanguage === 'tr' ? 'Google Play sürümünde dijital üyelik ödemeleri yalnız Google Play Billing üzerinden sunulacaktır. Bu test sürümünde doğrudan kripto ödeme kapalıdır.' : 'In the Google Play build, digital membership payments will be offered only through Google Play Billing. Direct crypto payment is disabled in this test build.'}</Text>
          </View>
        </ScrollView> :
        activeModule === 'whitelistView' ?
'''
              s = s.replace(vip_gate_anchor, gate, 1)
          s = s.replace("{VIP_MONTHLY_USDT} USDT", "{IS_PLAY_STORE_BUILD ? (selectedLanguage === 'tr' ? 'Yakında' : 'Coming soon') : `${VIP_MONTHLY_USDT} USDT`}")
          s = s.replace("{VIP_YEARLY_USDT} USDT", "{IS_PLAY_STORE_BUILD ? (selectedLanguage === 'tr' ? 'Yakında' : 'Coming soon') : `${VIP_YEARLY_USDT} USDT`}")

          # Inheritance: friendly localized ownership error even though module is hidden from V1 dashboard.
          s = s.replace("error?.response?.data?.error ||\n        error?.message ||\n        t('inheritCreateFailed')", "String(error?.response?.data?.error || '').includes('requires a wallet owned by the authenticated user') ? (selectedLanguage === 'tr' ? 'Miras protokolü için hesabınıza kayıtlı bir cüzdan seçmelisiniz.' : 'Select a wallet registered to your account for the inheritance protocol.') : (error?.response?.data?.error || error?.message || t('inheritCreateFailed'))", 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check frontend/App.js
      - name: Commit production hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/App.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply real-device production hardening"
          git pull --rebase origin main
          git push origin HEAD:main
