name: Safe Sentinel Play Store Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/play-store-release-gate.yml'
      - 'frontend/android/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

permissions:
  contents: read

concurrency:
  group: safe-sentinel-play-store-release-gate
  cancel-in-progress: false

jobs:
  db-audit:
    name: Production Neon DB audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.SCAM_DATABASE_URL || secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate --schema ./schema.prisma
      - name: Require production DB secret
        run: test -n "$DATABASE_URL" || (echo '::error::SCAM_DATABASE_URL/DATABASE_URL missing' && exit 1)
      - name: Audit ScamAddress production table
        run: node scripts/audit-scam-addresses.mjs | tee db-audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: production-db-audit-${{ github.sha }}
          path: backend/db-audit.log
          retention-days: 30

  security-e2e:
    name: Security E2E and production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.SCAM_DATABASE_URL || secrets.DATABASE_URL }}
      SMOKE_BASE_URL: https://safe-sentinel-pro-1.onrender.com
      PORT: '3000'
      JWT_SECRET: safe-sentinel-ci-only-jwt-secret-2026-09-10-strong-value
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate --schema ./schema.prisma
      - name: Start local backend for regression tests
        shell: bash
        run: |
          nohup npm start > /tmp/safe-sentinel-backend.log 2>&1 &
          echo $! > /tmp/safe-sentinel-backend.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              echo 'Local backend is ready.'
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/safe-sentinel-backend.pid)" 2>/dev/null; then
              echo '::error::Local backend exited before becoming healthy'
              cat /tmp/safe-sentinel-backend.log || true
              exit 1
            fi
            sleep 2
          done
          echo '::error::Local backend did not become healthy in time'
          cat /tmp/safe-sentinel-backend.log || true
          exit 1
      - name: Backend security regression tests
        env:
          TEST_API_BASE_URL: http://127.0.0.1:3000
        run: npm test
      - name: Production API smoke test
        run: npm run smoke:local
      - name: Local backend log on failure
        if: failure()
        run: cat /tmp/safe-sentinel-backend.log || true

  android-api36:
    name: Android API 36 gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Play target/compile SDK and release signing policy
        shell: bash
        run: |
          grep -Eq 'compileSdk[[:space:]]+36' frontend/android/app/build.gradle
          grep -Eq 'targetSdkVersion[[:space:]]+36' frontend/android/app/build.gradle
          grep -Eq 'buildType"?:?[[:space:]]*"app-bundle"|"buildType"[[:space:]]*:[[:space:]]*"app-bundle"' frontend/eas.json
          if awk '/release \{/{f=1} f&&/signingConfig signingConfigs\.debug/{exit 0} f&&/^        \}/{f=0} END{exit 1}' frontend/android/app/build.gradle; then
            echo '::error::Release build uses debug signing'
            exit 1
          fi
          echo 'Android API 36 and release AAB policy: PASS'

  release-aab:
    name: Signed Play Store AAB (GitHub Gradle)
    needs: [db-audit, security-e2e, android-api36]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_BACKEND_URL: https://safe-sentinel-pro-1.onrender.com
      EXPO_PUBLIC_PLAY_STORE_BUILD: 'true'
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: release.keystore
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Require Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo '::error::ANDROID_KEYSTORE_BASE64 missing' && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo '::error::ANDROID_KEYSTORE_PASSWORD missing' && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo '::error::ANDROID_KEY_ALIAS missing' && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo '::error::ANDROID_KEY_PASSWORD missing' && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          chmod 600 android/app/release.keystore
      - name: Verify keystore credentials
        shell: bash
        run: |
          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo 'Release keystore credentials: PASS'
      - name: Build signed production AAB with Gradle
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean bundleRelease
      - name: Verify signed AAB
        shell: bash
        run: |
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify "$AAB" >/dev/null
          cp "$AAB" safe-sentinel-production.aab
          echo "AAB_SIZE_BYTES=$(wc -c < safe-sentinel-production.aab)" >> "$GITHUB_ENV"
          echo 'AAB signature verification: PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: safe-sentinel-play-store-aab-${{ github.sha }}
          path: frontend/safe-sentinel-production.aab
          if-no-files-found: error
          retention-days: 30
      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f android/app/release.keystore
      - name: Release summary
        if: success()
        run: |
          echo '## Safe Sentinel Play Store release gate' >> "$GITHUB_STEP_SUMMARY"
          echo 'DB audit: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Security E2E: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Android API 36: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Signing: GitHub-hosted Gradle + production EAS keystore' >> "$GITHUB_STEP_SUMMARY"
          echo "Signed AAB size: ${AAB_SIZE_BYTES} bytes" >> "$GITHUB_STEP_SUMMARY"
