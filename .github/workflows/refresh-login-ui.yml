name: Refresh Login UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-login-ui.yml'
      - '.github/scripts/refresh-login-ui.cjs'

permissions:
  contents: write

jobs:
  patch-login-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply login UI refresh
        run: node .github/scripts/refresh-login-ui.cjs

      - name: Commit refreshed login UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/App.js
          git diff --cached --quiet && exit 0
          git commit -m "Refresh mobile login UI"
          git push origin main
