name: Refresh Login UI

on:
  push:
    paths:
      - '.github/workflows/refresh-login-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-login-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh login layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/App.js')
          text = path.read_text(encoding='utf-8-sig')

          start = text.index("  if (currentScreen === 'login') {")
          end = text.index("  if (currentScreen === 'register') {", start)

          replacement = r'''  if (currentScreen === 'login') {
    return (
      <SafeAreaView style={[styles.container, { backgroundColor: theme.bg }]}>
        <StatusBar barStyle={isDarkMode ? "light-content" : "dark-content"} />

        <ScrollView
          showsVerticalScrollIndicator={false}
          keyboardShouldPersistTaps="handled"
          contentContainerStyle={{
            flexGrow: 1,
            justifyContent: 'center',
            alignItems: 'center',
            paddingHorizontal: 18,
            paddingVertical: 28
          }}>

          <View
            style={[
              styles.card,
              {
                backgroundColor: theme.cardBg,
                width: '100%',
                maxWidth: 430,
                alignSelf: 'center',
                alignItems: 'center',
                paddingHorizontal: 18,
                paddingVertical: 22,
                borderRadius: 18,
                borderWidth: 1,
                borderColor: theme.borderCol
              }
            ]}>

            <View
              style={{
                width: 146,
                height: 116,
                alignItems: 'center',
                justifyContent: 'center',
                marginBottom: 12,
                borderRadius: 26,
                backgroundColor: isDarkMode ? '#0D1726' : '#EEF4FF',
                borderWidth: 1,
                borderColor: isDarkMode ? '#173250' : '#D7E6FF',
                shadowColor: theme.primary,
                shadowOffset: { width: 0, height: 5 },
                shadowOpacity: 0.22,
                shadowRadius: 12,
                elevation: 7
              }}>
              <Image
                source={require('./assets/yenilogo.png')}
                style={{ width: 126, height: 102, borderRadius: 20 }}
                resizeMode="contain" />
            </View>

            <Text
              style={{
                color: theme.primary,
                fontSize: 22,
                fontWeight: '900',
                textAlign: 'center',
                letterSpacing: 0.9,
                marginBottom: 7
              }}>
              SAFE SENTINEL PRO
            </Text>

            <Text
              style={{
                color: theme.textSub,
                fontSize: 11,
                textAlign: 'center',
                lineHeight: 17,
                marginBottom: 16
              }}>
              {t('loginDescription')}
            </Text>

            <Text
              style={{
                color: theme.textSub,
                fontSize: 10,
                fontWeight: '700',
                textAlign: 'center',
                marginBottom: 7
              }}>
              {t('language')}
            </Text>

            <View
              style={{
                flexDirection: 'row',
                justifyContent: 'center',
                alignItems: 'center',
                marginBottom: 20
              }}>
              {Object.entries(V26_GLOBAL_I18N).map(([code, item]) => {
                const active = selectedLanguage === code;
                return (
                  <TouchableOpacity
                    key={`login-language-${code}`}
                    onPress={() => saveGlobalLanguage(code)}
                    activeOpacity={0.85}
                    style={{
                      minWidth: 82,
                      height: 38,
                      justifyContent: 'center',
                      alignItems: 'center',
                      backgroundColor: active ? theme.primary : theme.inputBg,
                      borderWidth: 1,
                      borderColor: active ? theme.primary : theme.borderCol,
                      borderRadius: 10,
                      marginHorizontal: 4,
                      paddingHorizontal: 14,
                      shadowColor: active ? theme.primary : '#000000',
                      shadowOffset: { width: 0, height: 2 },
                      shadowOpacity: active ? 0.2 : 0,
                      shadowRadius: 5,
                      elevation: active ? 3 : 0
                    }}>
                    <Text
                      style={{
                        color: active ? '#FFFFFF' : theme.textMain,
                        fontSize: 12,
                        fontWeight: active ? '800' : '700'
                      }}>
                      {item.nativeName}
                    </Text>
                  </TouchableOpacity>
                );
              })}
            </View>

            <View style={{ width: '100%', marginBottom: 13 }}>
              <Text
                style={{
                  color: theme.textMain,
                  fontSize: 12,
                  fontWeight: '800',
                  marginBottom: 7
                }}>
                {t('emailAddress')}
              </Text>
              <TextInput
                style={[
                  styles.input,
                  {
                    backgroundColor: theme.inputBg,
                    color: theme.inputTextColor,
                    borderColor: theme.borderCol,
                    width: '100%',
                    height: 50,
                    borderRadius: 12,
                    fontSize: 13,
                    paddingHorizontal: 14,
                    paddingVertical: 0,
                    textAlignVertical: 'center'
                  }
                ]}
                placeholder="ornek@mail.com"
                placeholderTextColor="#7F8CA1"
                value={email}
                onChangeText={setEmail}
                autoCapitalize="none"
                keyboardType="email-address" />
            </View>

            <View style={{ width: '100%', marginBottom: 18 }}>
              <Text
                style={{
                  color: theme.textMain,
                  fontSize: 12,
                  fontWeight: '800',
                  marginBottom: 7
                }}>
                {t('loginPassword')}
              </Text>
              <TextInput
                style={[
                  styles.input,
                  {
                    backgroundColor: theme.inputBg,
                    color: theme.inputTextColor,
                    borderColor: theme.borderCol,
                    width: '100%',
                    height: 50,
                    borderRadius: 12,
                    fontSize: 13,
                    paddingHorizontal: 14,
                    paddingVertical: 0,
                    textAlignVertical: 'center'
                  }
                ]}
                placeholder="••••••••"
                placeholderTextColor="#7F8CA1"
                value={password}
                onChangeText={setPassword}
                secureTextEntry />
            </View>

            <TouchableOpacity
              style={[
                styles.button,
                {
                  width: '100%',
                  height: 48,
                  backgroundColor: theme.primary,
                  marginBottom: 11,
                  borderRadius: 12,
                  shadowColor: theme.primary,
                  shadowOffset: { width: 0, height: 5 },
                  shadowOpacity: 0.26,
                  shadowRadius: 10,
                  elevation: 6
                }
              ]}
              activeOpacity={0.86}
              onPress={handleLogin}>
              <Text style={[styles.buttonText, { fontSize: 13, fontWeight: '900' }]}>
                {t('secureLogin')}
              </Text>
            </TouchableOpacity>

            <TouchableOpacity
              style={[
                styles.button,
                {
                  width: '100%',
                  height: 46,
                  backgroundColor: 'transparent',
                  borderWidth: 1.5,
                  borderColor: theme.borderCol,
                  borderRadius: 12
                }
              ]}
              activeOpacity={0.82}
              onPress={() => setCurrentScreen('register')}>
              <Text style={{ color: theme.primary, fontWeight: '800', fontSize: 12 }}>
                {t('createAccount')}
              </Text>
            </TouchableOpacity>

            <View
              style={{
                width: '100%',
                marginTop: 18,
                paddingTop: 14,
                borderTopWidth: 1,
                borderTopColor: theme.borderCol,
                alignItems: 'center'
              }}>
              <Text
                style={{
                  color: theme.textSub,
                  fontSize: 9,
                  fontWeight: '700',
                  textAlign: 'center',
                  letterSpacing: 0.4
                }}>
                {selectedLanguage === 'tr'
                  ? 'DAHA GÜVENLİ   ·   DAHA BİLİNÇLİ   ·   DAHA ÖZGÜR'
                  : 'SAFER   ·   SMARTER   ·   FREER'}
              </Text>
            </View>
          </View>
        </ScrollView>
      </SafeAreaView>
    );
  }

'''

          updated = text[:start] + replacement + text[end:]
          path.write_text(updated, encoding='utf-8')
          print('Login UI refreshed successfully.')
          PY

      - name: Commit refreshed login UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/App.js
          git commit -m "Refresh mobile login UI" || exit 0
          git push origin main
