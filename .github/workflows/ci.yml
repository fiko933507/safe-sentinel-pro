name: Safe Sentinel Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and Prisma validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET: ci-only-jwt-secret-safe-sentinel-1234567890
      CORS_ORIGIN: https://example.invalid
      VIP_TRON_ADDRESS: TExampleOnlyNotARealProductionAddress1234
      TRONGRID_API_KEY: ci-placeholder
      PORT: 4000
      TEST_API_BASE_URL: http://127.0.0.1:4000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply CI migrations
        run: npm run prisma:migrate:deploy
      - name: Start backend for HTTP protection tests
        run: |
          npm start > /tmp/safe-sentinel-backend.log 2>&1 &
          echo $! > /tmp/safe-sentinel-backend.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              echo "Backend ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/safe-sentinel-backend.log
          exit 1
      - name: Run backend tests
        run: npm test
      - name: Syntax-check production server
        run: node --check src/server.js
      - name: Syntax-check security engine
        run: node --check src/security-v2.js
      - name: Show backend logs on failure
        if: failure()
        run: cat /tmp/safe-sentinel-backend.log || true

  frontend:
    name: Frontend release and i18n audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_ENV: production
      EXPO_PUBLIC_BACKEND_URL: https://example.invalid
      EXPO_PUBLIC_PLAY_STORE_BUILD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Release and i18n audit
        run: npm test
      - name: Babel parse production App.js
        run: node -e "require('@babel/core').transformFileSync('App.js',{configFile:'./babel.config.js'}); console.log('BABEL PARSE PASSED')"
      - name: Expo dependency check
        run: npx --yes expo-doctor@1.20.4
      - name: Expo production Android export
        run: npx expo export --platform android --output-dir dist-ci
      - name: Verify Expo export
        run: test -d dist-ci

  android-release:
    name: Android release AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_ENV: production
      EXPO_PUBLIC_BACKEND_URL: https://example.invalid
      EXPO_PUBLIC_PLAY_STORE_BUILD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build Android release bundle
        run: |
          chmod +x android/gradlew
          ./android/gradlew --no-daemon -p android bundleRelease
      - name: Verify AAB and release metadata
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          grep -q "applicationId 'com.fiko93.safesentinel'" android/app/build.gradle
          grep -q 'versionCode 1' android/app/build.gradle
          grep -q 'targetSdkVersion 36' android/app/build.gradle
          grep -q 'compileSdk 36' android/app/build.gradle
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          ! grep -q 'SYSTEM_ALERT_WINDOW' android/app/src/main/AndroidManifest.xml
          ! grep -q 'READ_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          ! grep -q 'WRITE_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          file assets/yenilogo.png | grep -q 'PNG image data'
          python - <<'PY'
          from PIL import Image
          image = Image.open('assets/yenilogo.png')
          assert image.format == 'PNG'
          assert image.width == image.height, image.size
          print(f'Validated icon: {image.width}x{image.height}')
          PY
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: safe-sentinel-play-store-aab-${{ github.sha }}
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
