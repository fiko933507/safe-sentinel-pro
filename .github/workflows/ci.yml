name: Safe Sentinel Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and Prisma validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Run backend tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-only-jwt-secret-safe-sentinel-1234567890
          CORS_ORIGIN: https://example.invalid
          VIP_TRON_ADDRESS: TExampleOnlyNotARealProductionAddress1234
          TRONGRID_API_KEY: ci-placeholder

      - name: Syntax-check production server
        run: node --check src/server.js

      - name: Syntax-check security engine
        run: node --check src/security-v2.js

  frontend:
    name: Frontend release and i18n audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Release and i18n audit
        run: npm test

      - name: Babel parse production App.js
        run: node -e "require('@babel/core').transformFileSync('App.js',{configFile:'./babel.config.js'}); console.log('BABEL PARSE PASSED')"
        env:
          EXPO_PUBLIC_BACKEND_URL: https://example.invalid

      - name: Expo dependency check
        run: npx expo-doctor
