name: Generate Backend Lockfile Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-lockfile-once.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic backend package lock
        working-directory: backend
        run: npm install --package-lock-only --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Verify lockfile with clean install
        working-directory: backend
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Prisma and syntax verification
        working-directory: backend
        run: |
          npm run prisma:generate
          npx prisma validate
          node --check src/server.js
          node --check src/security-v2.js
      - name: Commit lockfile
        run: |
          git diff --check
          if git diff --quiet -- backend/package-lock.json; then
            echo "Backend lockfile already current"
            exit 0
          fi
          git config user.name "safe-sentinel-ci"
          git config user.email "actions@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "Add deterministic backend dependency lockfile"
          git push
