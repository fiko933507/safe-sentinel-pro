name: Safe Sentinel One-Time I18N Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i18n-fix-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair translation dictionary and remaining inheritance alert
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'frontend/App.js';
          let s = fs.readFileSync(file, 'utf8');

          const exact = new Map([
            ["    inheritCreateFailedTitle: t('inheritCreateFailedTitle'),", "    inheritCreateFailedTitle: 'Miras Protokolü Hatası',"],
            ["    inheritCreateFailed: t('inheritCreateFailed'),", "    inheritCreateFailed: 'Miras protokolü oluşturulamadı.',"],
            ["    inheritHeartbeatFailedTitle: t('inheritHeartbeatFailedTitle'),", "    inheritHeartbeatFailedTitle: 'Heartbeat Hatası',"],
            ["    inheritHeartbeatFailed: t('inheritHeartbeatFailed'),", "    inheritHeartbeatFailed: 'Heartbeat güncellenemedi.',"],
            ["    inheritCancelFailedTitle: t('inheritCancelFailedTitle'),", "    inheritCancelFailedTitle: 'İptal Hatası',"],
            ["    inheritCancelFailed: t('inheritCancelFailed'),", "    inheritCancelFailed: 'Miras protokolü iptal edilemedi.',"]
          ]);

          for (const [from, to] of exact) {
            if (!s.includes(from)) throw new Error(`Expected repair target not found: ${from}`);
            s = s.replace(from, to);
          }

          const oldCreated = `      Alert.alert(\n        'Miras Protokolü Oluşturuldu',\n        \`Protokol backend üzerinde oluşturuldu.\\\nDurum: \${protocol.status}\\\nAğ: \${protocol.network}\\\nSüre: \${protocol.inactivityDays} gün\`\n      );`;
          const newCreated = `      Alert.alert(\n        t('inheritCreatedTitle'),\n        \`\${protocol.status} · \${protocol.network} · \${protocol.inactivityDays} gün\`\n      );`;
          if (s.includes(oldCreated)) s = s.replace(oldCreated, newCreated);

          const start = s.indexOf('const V26_TRANSLATIONS =');
          const end = s.indexOf('const v26GetTranslation', start);
          if (start < 0 || end < 0) throw new Error('Translation dictionary bounds not found');
          const dictionary = s.slice(start, end);
          if (/^\s*\w+\s*:\s*t\(/m.test(dictionary)) {
            throw new Error('Runtime t() call found inside translation dictionary');
          }

          s = s.split('\n').map(line => line.replace(/[ \t]+$/g, '')).join('\n');
          fs.writeFileSync(file, s, 'utf8');
          NODE
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate repaired frontend
        working-directory: frontend
        run: npm test
      - name: Validate diff
        run: git diff --check
      - name: Commit verified repair
        run: |
          if git diff --quiet; then
            echo "No repair changes required"
            exit 0
          fi
          git config user.name "safe-sentinel-ci"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/App.js
          git commit -m "Repair i18n dictionary runtime values"
          git push
