name: Final Release Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-release-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply launch, Guardian and performance fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('frontend/App.js')
          s = app_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # 1) Cache auth token in memory so every API call does not cross the
          # SecureStore bridge. Persistent storage remains the source across launches.
          interceptor_pattern = re.compile(
              r"api\.interceptors\.request\.use\(async \(config\) => \{.*?\n\}\);\n\n// --- ENTEGRE EDİLEN YENİ SİSTEMLER",
              re.S,
          )
          cache_block = '''let cachedAuthToken;
          const setCachedAuthToken = (value) => {
            cachedAuthToken = value ? String(value) : null;
          };
          const getCachedAuthToken = async () => {
            if (cachedAuthToken !== undefined) return cachedAuthToken;
            try {
              const stored = Platform.OS === 'web'
                ? await AsyncStorage.getItem('user_secure_token')
                : await SecureStore.getItemAsync('user_secure_token');
              setCachedAuthToken(stored);
              return cachedAuthToken;
            } catch (error) {
              cachedAuthToken = null;
              console.warn('Auth token okunamadı:', error);
              return null;
            }
          };

          api.interceptors.request.use(async (config) => {
            const token = await getCachedAuthToken();
            if (token) {
              config.headers = config.headers || {};
              config.headers.Authorization = `Bearer ${token}`;
            }
            return config;
          });

          // --- ENTEGRE EDİLEN YENİ SİSTEMLER'''
          s, n = interceptor_pattern.subn(cache_block, s, count=1)
          if n != 1:
              raise SystemExit(f'auth interceptor patch failed: {n}')

          # 2) Do not hammer a waking backend with duplicate startup requests.
          old_health_effect = '''  useEffect(() => {
            checkBackendHealth();
            const healthTimer = setInterval(checkBackendHealth, 60000);
            return () => clearInterval(healthTimer);
          }, [checkBackendHealth]);'''
          new_health_effect = '''  useEffect(() => {
            // The login-screen warmup already performs the first health request.
            // Keep later health checks periodic so cold-start login is not competing
            // with duplicate /health traffic.
            const healthTimer = setInterval(checkBackendHealth, 60000);
            return () => clearInterval(healthTimer);
          }, [checkBackendHealth]);'''
          s = replace_once(s, old_health_effect, new_health_effect, 'health effect')

          old_fx_effect = '''  useEffect(() => {
            fetchLiveExchangeRates();
            const timer = setInterval(fetchLiveExchangeRates, 15 * 60 * 1000);
            return () => clearInterval(timer);
          }, [fetchLiveExchangeRates]);'''
          new_fx_effect = '''  useEffect(() => {
            if (!token) return undefined;
            const initialTimer = setTimeout(fetchLiveExchangeRates, 1200);
            const timer = setInterval(fetchLiveExchangeRates, 15 * 60 * 1000);
            return () => {
              clearTimeout(initialTimer);
              clearInterval(timer);
            };
          }, [token, fetchLiveExchangeRates]);'''
          s = replace_once(s, old_fx_effect, new_fx_effect, 'fx effect')

          old_price_alert_effect = '''  useEffect(() => {
            loadPriceAlerts();
          }, [loadPriceAlerts]);'''
          new_price_alert_effect = '''  useEffect(() => {
            if (!token) {
              setSavedPriceAlerts([]);
              return undefined;
            }
            const timer = setTimeout(loadPriceAlerts, 1000);
            return () => clearTimeout(timer);
          }, [token, loadPriceAlerts]);'''
          s = replace_once(s, old_price_alert_effect, new_price_alert_effect, 'price alert effect')

          old_central_poll = '''    centralNotificationPolling();

            const timer = setInterval(
              centralNotificationPolling,
              15000
            );

            return () => clearInterval(timer);'''
          new_central_poll = '''    const firstPollTimer = setTimeout(centralNotificationPolling, 900);

            const timer = setInterval(
              centralNotificationPolling,
              45000
            );

            return () => {
              clearTimeout(firstPollTimer);
              clearInterval(timer);
            };'''
          s = replace_once(s, old_central_poll, new_central_poll, 'central notification polling')

          old_init = '''  useEffect(() => {
            if (!(Platform.OS === 'android' && __DEV__)) {
              Notifications.requestPermissionsAsync().catch((e) =>
              handleIsolatedError("Bildirim İzni", e)
              );
            }

            const initializeApp = async () => {
              // Wake the backend in parallel; never block local session restoration.
              const backendWakeup = checkBackendHealth();
              const authenticated = await loadSecureAndLocalData();

              await Promise.allSettled([
                backendWakeup,
                authenticated ? fetchLiveGasFees() : Promise.resolve(),
                fetchLiveCoinGeckoPrices()
              ]);
            };

            initializeApp();
          }, [
          loadSecureAndLocalData,
          checkBackendHealth,
          fetchLiveCoinGeckoPrices,
          fetchLiveGasFees,
          handleIsolatedError]
          );'''
          new_init = '''  useEffect(() => {
            // First paint must never wait for permissions, prices, gas or a second
            // backend health request. Restore local/session data only.
            loadSecureAndLocalData();
          }, [loadSecureAndLocalData]);

          useEffect(() => {
            if (!token) return undefined;
            // Non-critical dashboard data starts after the authenticated UI paints.
            const timer = setTimeout(fetchLiveCoinGeckoPrices, 900);
            return () => clearTimeout(timer);
          }, [token, fetchLiveCoinGeckoPrices]);'''
          s = replace_once(s, old_init, new_init, 'initialization effect')

          # 3) Restore local data and SecureStore token in parallel.
          old_local_reads = '''      const savedWhite = await AsyncStorage.getItem('@whitelist');
              const savedBlack = await AsyncStorage.getItem('@blacklist');
              const savedVault = await AsyncStorage.getItem('@vault');
              const savedRecentTransactions = await AsyncStorage.getItem('@safe_sentinel_recent_transactions');'''
          new_local_reads = '''      const localDataPromise = AsyncStorage.multiGet([
                '@whitelist',
                '@blacklist',
                '@vault',
                '@safe_sentinel_recent_transactions'
              ]);
              const secureTokenPromise = Platform.OS === 'web'
                ? AsyncStorage.getItem('user_secure_token')
                : SecureStore.getItemAsync('user_secure_token');
              const [localPairs, secureApiKey] = await Promise.all([
                localDataPromise,
                secureTokenPromise
              ]);
              const localData = Object.fromEntries(localPairs);
              const savedWhite = localData['@whitelist'];
              const savedBlack = localData['@blacklist'];
              const savedVault = localData['@vault'];
              const savedRecentTransactions = localData['@safe_sentinel_recent_transactions'];
              setCachedAuthToken(secureApiKey);'''
          s = replace_once(s, old_local_reads, new_local_reads, 'parallel local reads')

          old_secure_read = '''      const secureApiKey =
              Platform.OS === 'web' ?
              await AsyncStorage.getItem('user_secure_token') :
              await SecureStore.getItemAsync('user_secure_token');

          '''
          if old_secure_read not in s:
              raise SystemExit('old secure token read not found after local patch')
          s = s.replace(old_secure_read, '', 1)

          # Clear cache when an explicitly invalid restored session is removed.
          invalid_session_anchor = '''            sessionAuthenticated = false;
                    setToken(null);
                    setCurrentScreen('login');'''
          invalid_session_new = '''            sessionAuthenticated = false;
                    setCachedAuthToken(null);
                    setToken(null);
                    setCurrentScreen('login');'''
          s = replace_once(s, invalid_session_anchor, invalid_session_new, 'invalid session cache clear')

          # 4) Login: show dashboard immediately after a successful server response;
          # persistent token write continues asynchronously.
          login_start = s.index('  const handleLogin = async () => {')
          login_end = s.index('  const handleCompleteRegistration = async () => {', login_start)
          login = s[login_start:login_end]
          old_login_success = '''      if (Platform.OS === 'web') {
                await AsyncStorage.setItem('user_secure_token', sessionToken);
              } else {
                await SecureStore.setItemAsync('user_secure_token', sessionToken);
              }

              setToken(sessionToken);
              setName(user.name || '');
              setEmail(user.email || cleanEmail);
              setUserStatus(user.status || 'free');
              setQueryCount(0);
              setApiOnline(true);
              setCurrentScreen('dashboard');
              setActiveModule('dashboard');'''
          new_login_success = '''      setCachedAuthToken(sessionToken);
              setToken(sessionToken);
              setName(user.name || '');
              setEmail(user.email || cleanEmail);
              setUserStatus(user.status || 'free');
              setQueryCount(0);
              setApiOnline(true);
              setCurrentScreen('dashboard');
              setActiveModule('dashboard');

              const persistSession = Platform.OS === 'web'
                ? AsyncStorage.setItem('user_secure_token', sessionToken)
                : SecureStore.setItemAsync('user_secure_token', sessionToken);
              persistSession.catch((storageError) =>
                console.warn('Session token kalıcılaştırılamadı:', storageError?.message || storageError)
              );'''
          if login.count(old_login_success) != 1:
              raise SystemExit(f'login success patch expected 1 match, found {login.count(old_login_success)}')
          login = login.replace(old_login_success, new_login_success, 1)
          s = s[:login_start] + login + s[login_end:]

          # Registration also primes the in-memory token cache.
          reg_anchor = '''      if (!token || !user) {
                throw new Error(t("runtimeInvalidRegisterResponse"));
              }

          '''
          reg_new = '''      if (!token || !user) {
                throw new Error(t("runtimeInvalidRegisterResponse"));
              }
              setCachedAuthToken(token);

          '''
          s = replace_once(s, reg_anchor, reg_new, 'registration token cache')

          # Logout and account deletion must invalidate the in-memory token too.
          logout_anchor = '''    setToken(null);
            setCurrentScreen('login');
            setActiveModule('dashboard');
          };
          const handleDeleteAccount'''
          logout_new = '''    setCachedAuthToken(null);
            setToken(null);
            setCurrentScreen('login');
            setActiveModule('dashboard');
          };
          const handleDeleteAccount'''
          s = replace_once(s, logout_anchor, logout_new, 'logout token cache')

          delete_anchor = '''            setToken(null);
                    setName('');
                    setEmail('');'''
          delete_new = '''            setCachedAuthToken(null);
                    setToken(null);
                    setName('');
                    setEmail('');'''
          s = replace_once(s, delete_anchor, delete_new, 'delete account token cache')

          # 5) Guardian: exact theme keys were invalid and fell back to black text.
          s = re.sub(r'\btheme\.text\b', 'theme.textMain', s)
          s = re.sub(r'\btheme\.subText\b', 'theme.textSub', s)

          guardian_start = s.index("{t('guardianLiveRisk')}")
          guardian_end = s.index("</ScrollView> : activeModule === 'inheritView'", guardian_start)
          guardian = s[guardian_start:guardian_end]
          guardian = guardian.replace(
              "{t('guardianRiskDescription1')}\n              {t('guardianRiskDescription2')}",
              "{t('guardianRiskDescription1')}{' '}\n              {t('guardianRiskDescription2')}",
              1,
          )
          guardian = guardian.replace(
              '<View style={{ marginTop: 12 }}>',
              "<View style={{ marginTop: 12, padding: 10, borderRadius: 8, backgroundColor: theme.cardBg, borderWidth: 1, borderColor: theme.borderCol }}>",
              1,
          )
          s = s[:guardian_start] + guardian + s[guardian_end:]

          # Guardian save/refresh already updates the visible sync state. Avoid the
          # Android modal overlay that covered the risk explanation card.
          s = s.replace("                  Alert.alert(\n                    'Guardian',\n                    t('guardianUpdated')\n                  );\n", '', 1)
          s = s.replace("                  Alert.alert('Guardian', t('guardianProfileRefreshed'));\n", '', 1)

          # 6) Remove unreachable dead helper left after a return in security-list sync.
          dead_pattern = re.compile(
              r"\n      const removeSecurityAddress = async \(type, id\) => \{.*?\n      \};\n\n    \} catch \(error\) \{",
              re.S,
          )
          s, dead_count = dead_pattern.subn("\n\n    } catch (error) {", s, count=1)
          if dead_count != 1:
              raise SystemExit(f'dead security helper patch failed: {dead_count}')

          # Invariants.
          if re.search(r'\btheme\.text\b|\btheme\.subText\b', s):
              raise SystemExit('undefined theme text key remains')
          for marker in [
              'setCachedAuthToken',
              'AsyncStorage.multiGet',
              'firstPollTimer',
              '45000',
              "setTimeout(fetchLiveCoinGeckoPrices, 900)",
              "{t('guardianRiskDescription1')}{' '}",
          ]:
              if marker not in s:
                  raise SystemExit(f'missing performance/UI marker: {marker}')

          app_path.write_text(s, encoding='utf-8')

          # Native theme: after the branded splash is dismissed, AppTheme used to
          # expose the platform's white window before React's first frame.
          styles_path = Path('frontend/android/app/src/main/res/values/styles.xml')
          styles = styles_path.read_text(encoding='utf-8')
          old_theme = '''  <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
              <item name="android:editTextBackground">@drawable/rn_edit_text_material</item>
              <item name="colorPrimary">@color/colorPrimary</item>
              <item name="android:statusBarColor">@android:color/transparent</item>
              <item name="android:navigationBarColor">@android:color/transparent</item>
            </style>'''
          new_theme = '''  <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
              <item name="android:editTextBackground">@drawable/rn_edit_text_material</item>
              <item name="colorPrimary">@color/colorPrimary</item>
              <item name="android:windowBackground">@color/splashscreen_background</item>
              <item name="android:colorBackground">@color/splashscreen_background</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
              <item name="android:statusBarColor">@android:color/transparent</item>
              <item name="android:navigationBarColor">@android:color/transparent</item>
            </style>'''
          if old_theme not in styles:
              raise SystemExit('AppTheme anchor not found')
          styles = styles.replace(old_theme, new_theme, 1)
          styles_path.write_text(styles, encoding='utf-8')
          PY

      - name: Validate frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          EXPO_PUBLIC_BACKEND_URL: https://safe-sentinel-pro-1.onrender.com
          EXPO_PUBLIC_PLAY_STORE_BUILD: 'true'
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          node --check App.js
          node -e "require('@babel/core').transformFileSync('App.js',{configFile:'./babel.config.js'}); console.log('BABEL PARSE PASSED')"
          npx expo install --check

      - name: Commit final release polish
        shell: bash
        run: |
          git config user.name 'safe-sentinel-release-bot'
          git config user.email 'safe-sentinel-release-bot@users.noreply.github.com'
          git add frontend/App.js frontend/android/app/src/main/res/values/styles.xml
          git diff --cached --check
          git commit -m 'fix(app): remove launch flash and polish Guardian performance'
          git push origin HEAD:main
