name: Final Release Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-release-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply launch, Guardian and performance fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('frontend/App.js')
          s = app_path.read_text(encoding='utf-8')

          def sub_once(pattern, replacement, text, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return updated

          # Cache the auth token in memory. SecureStore remains persistent storage,
          # but ordinary API calls no longer cross the native bridge every time.
          s = sub_once(
              r"api\.interceptors\.request\.use\(async \(config\) => \{.*?\n\}\);\n\n// --- ENTEGRE EDİLEN YENİ SİSTEMLER",
              '''let cachedAuthToken;
          const setCachedAuthToken = (value) => {
            cachedAuthToken = value ? String(value) : null;
          };
          const getCachedAuthToken = async () => {
            if (cachedAuthToken !== undefined) return cachedAuthToken;
            try {
              const stored = Platform.OS === 'web'
                ? await AsyncStorage.getItem('user_secure_token')
                : await SecureStore.getItemAsync('user_secure_token');
              setCachedAuthToken(stored);
              return cachedAuthToken;
            } catch (error) {
              cachedAuthToken = null;
              console.warn('Auth token okunamadı:', error);
              return null;
            }
          };

          api.interceptors.request.use(async (config) => {
            const token = await getCachedAuthToken();
            if (token) {
              config.headers = config.headers || {};
              config.headers.Authorization = `Bearer ${token}`;
            }
            return config;
          });

          // --- ENTEGRE EDİLEN YENİ SİSTEMLER''',
              s,
              'auth interceptor',
              re.S,
          )

          # Keep only the dedicated login warmup as the immediate /health request.
          s = sub_once(
              r"  useEffect\(\(\) => \{\s*checkBackendHealth\(\);\s*const healthTimer = setInterval\(checkBackendHealth, 60000\);\s*return \(\) => clearInterval\(healthTimer\);\s*\}, \[checkBackendHealth\]\);",
              '''  useEffect(() => {
            const healthTimer = setInterval(checkBackendHealth, 60000);
            return () => clearInterval(healthTimer);
          }, [checkBackendHealth]);''',
              s,
              'health effect',
              re.S,
          )

          # Non-critical market data should never compete with login or first paint.
          s = sub_once(
              r"  useEffect\(\(\) => \{\s*fetchLiveExchangeRates\(\);\s*const timer = setInterval\(fetchLiveExchangeRates, 15 \* 60 \* 1000\);\s*return \(\) => clearInterval\(timer\);\s*\}, \[fetchLiveExchangeRates\]\);",
              '''  useEffect(() => {
            if (!token) return undefined;
            const initialTimer = setTimeout(fetchLiveExchangeRates, 1200);
            const timer = setInterval(fetchLiveExchangeRates, 15 * 60 * 1000);
            return () => {
              clearTimeout(initialTimer);
              clearInterval(timer);
            };
          }, [token, fetchLiveExchangeRates]);''',
              s,
              'fx effect',
              re.S,
          )

          s = sub_once(
              r"  useEffect\(\(\) => \{\s*loadPriceAlerts\(\);\s*\}, \[loadPriceAlerts\]\);",
              '''  useEffect(() => {
            if (!token) {
              setSavedPriceAlerts([]);
              return undefined;
            }
            const timer = setTimeout(loadPriceAlerts, 1000);
            return () => clearTimeout(timer);
          }, [token, loadPriceAlerts]);''',
              s,
              'price-alert effect',
              re.S,
          )

          s = sub_once(
              r"\s*centralNotificationPolling\(\);\s*const timer = setInterval\(\s*centralNotificationPolling,\s*15000\s*\);\s*return \(\) => clearInterval\(timer\);",
              '''
            const firstPollTimer = setTimeout(centralNotificationPolling, 900);

            const timer = setInterval(
              centralNotificationPolling,
              45000
            );

            return () => {
              clearTimeout(firstPollTimer);
              clearInterval(timer);
            };''',
              s,
              'central notification polling',
              re.S,
          )

          # Cold launch: only restore local/session data. Prices and other secondary
          # requests start after the authenticated interface has painted.
          s = sub_once(
              r"  useEffect\(\(\) => \{\s*if \(!\(Platform\.OS === 'android' && __DEV__\)\) \{.*?initializeApp\(\);\s*\}, \[\s*loadSecureAndLocalData,\s*checkBackendHealth,\s*fetchLiveCoinGeckoPrices,\s*fetchLiveGasFees,\s*handleIsolatedError\]\s*\);",
              '''  useEffect(() => {
            loadSecureAndLocalData();
          }, [loadSecureAndLocalData]);

          useEffect(() => {
            if (!token) return undefined;
            const timer = setTimeout(fetchLiveCoinGeckoPrices, 900);
            return () => clearTimeout(timer);
          }, [token, fetchLiveCoinGeckoPrices]);''',
              s,
              'cold-start initialization',
              re.S,
          )

          # Restore four AsyncStorage values and SecureStore token concurrently.
          s = sub_once(
              r"\s*const savedWhite = await AsyncStorage\.getItem\('@whitelist'\);\s*const savedBlack = await AsyncStorage\.getItem\('@blacklist'\);\s*const savedVault = await AsyncStorage\.getItem\('@vault'\);\s*const savedRecentTransactions = await AsyncStorage\.getItem\('@safe_sentinel_recent_transactions'\);",
              '''
              const localDataPromise = AsyncStorage.multiGet([
                '@whitelist',
                '@blacklist',
                '@vault',
                '@safe_sentinel_recent_transactions'
              ]);
              const secureTokenPromise = Platform.OS === 'web'
                ? AsyncStorage.getItem('user_secure_token')
                : SecureStore.getItemAsync('user_secure_token');
              const [localPairs, secureApiKey] = await Promise.all([
                localDataPromise,
                secureTokenPromise
              ]);
              const localData = Object.fromEntries(localPairs);
              const savedWhite = localData['@whitelist'];
              const savedBlack = localData['@blacklist'];
              const savedVault = localData['@vault'];
              const savedRecentTransactions = localData['@safe_sentinel_recent_transactions'];
              setCachedAuthToken(secureApiKey);''',
              s,
              'parallel local reads',
              re.S,
          )

          s = sub_once(
              r"\s*const secureApiKey =\s*Platform\.OS === 'web' \?\s*await AsyncStorage\.getItem\('user_secure_token'\) :\s*await SecureStore\.getItemAsync\('user_secure_token'\);",
              '',
              s,
              'old secure token read',
              re.S,
          )

          s = sub_once(
              r"sessionAuthenticated = false;\s*setToken\(null\);\s*setCurrentScreen\('login'\);",
              '''sessionAuthenticated = false;
                    setCachedAuthToken(null);
                    setToken(null);
                    setCurrentScreen('login');''',
              s,
              'invalid session cache clear',
              re.S,
          )

          # Login: server response switches the screen immediately. Persistence can
          # finish asynchronously and no longer adds latency to the visible login.
          login_start = s.index('  const handleLogin = async () => {')
          login_end = s.index('  const handleCompleteRegistration = async () => {', login_start)
          login = s[login_start:login_end]
          login = sub_once(
              r"\s*if \(Platform\.OS === 'web'\) \{\s*await AsyncStorage\.setItem\('user_secure_token', sessionToken\);\s*\} else \{\s*await SecureStore\.setItemAsync\('user_secure_token', sessionToken\);\s*\}\s*setToken\(sessionToken\);\s*setName\(user\.name \|\| ''\);\s*setEmail\(user\.email \|\| cleanEmail\);\s*setUserStatus\(user\.status \|\| 'free'\);\s*setQueryCount\(0\);\s*setApiOnline\(true\);\s*setCurrentScreen\('dashboard'\);\s*setActiveModule\('dashboard'\);",
              '''
              setCachedAuthToken(sessionToken);
              setToken(sessionToken);
              setName(user.name || '');
              setEmail(user.email || cleanEmail);
              setUserStatus(user.status || 'free');
              setQueryCount(0);
              setApiOnline(true);
              setCurrentScreen('dashboard');
              setActiveModule('dashboard');

              const persistSession = Platform.OS === 'web'
                ? AsyncStorage.setItem('user_secure_token', sessionToken)
                : SecureStore.setItemAsync('user_secure_token', sessionToken);
              persistSession.catch((storageError) =>
                console.warn('Session token kalıcılaştırılamadı:', storageError?.message || storageError)
              );''',
              login,
              'login success path',
              re.S,
          )
          s = s[:login_start] + login + s[login_end:]

          # Prime/clear the token cache on all auth lifecycle paths.
          reg_start = s.index('  const handleCompleteRegistration = async () => {')
          reg_end = s.index('  const handleOpenWalletConnection = async () => {', reg_start)
          reg = s[reg_start:reg_end]
          reg = sub_once(
              r"if \(!token \|\| !user\) \{\s*throw new Error\(t\(\"runtimeInvalidRegisterResponse\"\)\);\s*\}",
              '''if (!token || !user) {
                throw new Error(t("runtimeInvalidRegisterResponse"));
              }
              setCachedAuthToken(token);''',
              reg,
              'registration cache',
              re.S,
          )
          s = s[:reg_start] + reg + s[reg_end:]

          logout_start = s.index('  const handleLogout = async () => {')
          logout_end = s.index('  const handleDeleteAccount = () => {', logout_start)
          logout = s[logout_start:logout_end]
          logout = sub_once(r"\n\s*setToken\(null\);", "\n    setCachedAuthToken(null);\n    setToken(null);", logout, 'logout cache')
          s = s[:logout_start] + logout + s[logout_end:]

          delete_start = s.index('  const handleDeleteAccount = () => {')
          delete_end = s.index('  const requestWithBackendRecovery = async', delete_start)
          delete_block = s[delete_start:delete_end]
          delete_block = sub_once(r"\n\s*setToken\(null\);", "\n            setCachedAuthToken(null);\n            setToken(null);", delete_block, 'delete cache')
          s = s[:delete_start] + delete_block + s[delete_end:]

          # Guardian contrast: these keys never existed and defaulted to black.
          s = re.sub(r'\btheme\.text\b', 'theme.textMain', s)
          s = re.sub(r'\btheme\.subText\b', 'theme.textSub', s)

          guardian_start = s.index("{t('guardianLiveRisk')}")
          guardian_end = s.index("</ScrollView> : activeModule === 'inheritView'", guardian_start)
          guardian = s[guardian_start:guardian_end]
          guardian = guardian.replace(
              "{t('guardianRiskDescription1')}\n              {t('guardianRiskDescription2')}",
              "{t('guardianRiskDescription1')}{' '}\n              {t('guardianRiskDescription2')}",
              1,
          )
          guardian = guardian.replace(
              '<View style={{ marginTop: 12 }}>',
              '<View style={{ marginTop: 12, padding: 10, borderRadius: 8, backgroundColor: theme.cardBg, borderWidth: 1, borderColor: theme.borderCol }}>',
              1,
          )
          s = s[:guardian_start] + guardian + s[guardian_end:]

          # Successful save/refresh is already visible in "Profil durumu". Remove
          # modal Alerts that dim/cover the live-risk explanation card.
          s, save_alerts = re.subn(
              r"\s*Alert\.alert\(\s*'Guardian',\s*t\('guardianUpdated'\)\s*\);",
              '',
              s,
              count=1,
              flags=re.S,
          )
          if save_alerts != 1:
              raise SystemExit(f'Guardian save Alert: expected 1, found {save_alerts}')
          s, refresh_alerts = re.subn(
              r"\s*Alert\.alert\('Guardian', t\('guardianProfileRefreshed'\)\);",
              '',
              s,
              count=1,
          )
          if refresh_alerts != 1:
              raise SystemExit(f'Guardian refresh Alert: expected 1, found {refresh_alerts}')

          # Remove the unreachable helper after return in list synchronization.
          s, dead_count = re.subn(
              r"\n\s*const removeSecurityAddress = async \(type, id\) => \{.*?\n\s*\};\s*(?=\} catch \(error\) \{)",
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          if dead_count != 1:
              raise SystemExit(f'dead security helper: expected 1, found {dead_count}')

          if re.search(r'\btheme\.text\b|\btheme\.subText\b', s):
              raise SystemExit('undefined Guardian theme text key remains')
          for marker in [
              'setCachedAuthToken',
              'AsyncStorage.multiGet',
              'firstPollTimer',
              '45000',
              "setTimeout(fetchLiveCoinGeckoPrices, 900)",
              "{t('guardianRiskDescription1')}{' '}",
          ]:
              if marker not in s:
                  raise SystemExit(f'missing final marker: {marker}')
          app_path.write_text(s, encoding='utf-8')

          # Prevent the native window from reverting to platform white between the
          # branded splash and React's first dark frame.
          styles_path = Path('frontend/android/app/src/main/res/values/styles.xml')
          styles = styles_path.read_text(encoding='utf-8')
          if 'android:windowBackground">@color/splashscreen_background' not in styles.split('<style name="Theme.App.SplashScreen"', 1)[0]:
              styles = styles.replace(
                  '    <item name="colorPrimary">@color/colorPrimary</item>\n',
                  '    <item name="colorPrimary">@color/colorPrimary</item>\n'
                  '    <item name="android:windowBackground">@color/splashscreen_background</item>\n'
                  '    <item name="android:colorBackground">@color/splashscreen_background</item>\n'
                  '    <item name="android:windowLightStatusBar">false</item>\n'
                  '    <item name="android:windowLightNavigationBar">false</item>\n',
                  1,
              )
          styles_path.write_text(styles, encoding='utf-8')
          PY

      - name: Validate frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          EXPO_PUBLIC_BACKEND_URL: https://safe-sentinel-pro-1.onrender.com
          EXPO_PUBLIC_PLAY_STORE_BUILD: 'true'
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          node --check App.js
          node -e "require('@babel/core').transformFileSync('App.js',{configFile:'./babel.config.js'}); console.log('BABEL PARSE PASSED')"
          npx expo install --check

      - name: Commit final release polish
        shell: bash
        run: |
          git config user.name 'safe-sentinel-release-bot'
          git config user.email 'safe-sentinel-release-bot@users.noreply.github.com'
          git add frontend/App.js frontend/android/app/src/main/res
          git diff --cached --check
          git commit -m 'fix(app): remove launch flash and polish Guardian performance'
          git push origin HEAD:main
