name: Apply Source Play Store Policy V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-production-policy-once-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Apply source production policy
        working-directory: frontend
        run: node scripts/apply-source-production-policy-once.mjs
      - name: Verify source production policy
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: https://example.invalid
          EXPO_PUBLIC_PLAY_STORE_BUILD: 'true'
        run: |
          npm test
          node -e "require('@babel/core').transformFileSync('App.js',{configFile:'./babel.config.js'}); console.log('BABEL PARSE PASSED')"
      - name: Verify clean diff
        run: git diff --check
      - name: Commit migrated source
        run: |
          if git diff --quiet -- frontend/App.js frontend/scripts/babel-supported-languages.cjs; then
            echo "Source production policy already applied"
            exit 0
          fi
          git config user.name "safe-sentinel-ci"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/App.js frontend/scripts/babel-supported-languages.cjs
          git commit -m "Enforce Play Store production policy in source"
          git pull --rebase origin main
          git push
