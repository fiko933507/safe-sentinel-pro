name: Inspect Guardian Cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-guardian-cards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Guardian and inheritance contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('frontend/App.js').read_text(encoding='utf-8')
          for needle in ['guardianView','inheritView','dashboardEmergencySecurity','toolTitleGuardian','toolTitleInheritance']:
              print(f'\n===== {needle} =====')
              pos=0; n=0
              while True:
                  i=text.find(needle,pos)
                  if i<0: break
                  n+=1
                  a=max(0,i-1400); b=min(len(text),i+2200)
                  print(f'\n--- occurrence {n} at {i} ---\n{text[a:b]}')
                  pos=i+1
              print('COUNT=',n)
          PY
