              s = replace_once(
                  s,
                  registration_anchor,
                  """      setUserStatus(user.status || 'free');
      setQueryCount(0);
      await syncSecurityAddressLists();
      await loadCentralNotifications();

      if (cleanVaultAddress) {""",
