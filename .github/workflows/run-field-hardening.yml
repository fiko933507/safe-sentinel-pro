name: Run Field Hardening

on:
  push:
    paths:
      - '.github/run-field-hardening-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Apply consolidated production hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected pattern: {label}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------
          # Frontend / Reown networks
          # ------------------------------------------------------------
          cfg_path = Path('frontend/AppKitConfig.js')
          cfg = cfg_path.read_text(encoding='utf-8-sig')

          if 'const base = {' not in cfg:
              cfg = replace_once(
                  cfg,
                  "const networks = [\n  ethereum,\n  polygon,\n  arbitrum,\n  bsc,\n  avalanche,\n];",
