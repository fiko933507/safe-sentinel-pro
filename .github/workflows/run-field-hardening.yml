name: Run Field Hardening

on:
  push:
    paths:
      - '.github/run-field-hardening-trigger'
      - '.github/workflows/run-field-hardening.yml'
      - '.github/scripts/final-production-hardening.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Apply final production hardening
        run: python .github/scripts/final-production-hardening.py

      - name: JavaScript syntax checks
        run: |
          node --check frontend/App.js
          node --check frontend/AppKitConfig.js
          node --check backend/src/server.js

      - name: Backend install and validation
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          JWT_SECRET: ci-only-jwt-secret-safe-sentinel-1234567890
          CORS_ORIGIN: https://example.invalid
          VIP_TRON_ADDRESS: TExampleOnlyNotARealProductionAddress1234
          TRONGRID_API_KEY: ci-placeholder
        run: |
          npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
          npx prisma generate --schema ./schema.prisma
          npx prisma validate --schema ./schema.prisma

      - name: Frontend install and audits
        working-directory: frontend
        env:
          NODE_ENV: production
          EXPO_PUBLIC_BACKEND_URL: https://safe-sentinel-pro-1.onrender.com
          EXPO_PUBLIC_PLAY_STORE_BUILD: 'true'
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx expo install --check
          node scripts/i18n-audit.mjs
          node scripts/release-audit.mjs
          node -e "require('@babel/core').transformFileSync('App.js',{configFile:'./babel.config.js'}); console.log('BABEL PARSE PASSED')"

      - name: Commit final hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/App.js frontend/AppKitConfig.js backend/src/server.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize production hardening before preview build"
          git pull --rebase origin main
          git push origin HEAD:main
