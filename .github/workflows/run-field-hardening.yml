name: Run Field Hardening

on:
  push:
    paths:
      - '.github/run-field-hardening-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Apply consolidated production hardening
        run: python .github/scripts/consolidated-production-hardening.py

      - name: JavaScript syntax checks
        run: |
          node --check frontend/App.js
          node --check frontend/AppKitConfig.js
          node --check backend/src/server.js

      - name: Backend install and validation
        working-directory: backend
        run: |
          npm ci
          npx prisma generate --schema ./schema.prisma
          npx prisma validate --schema ./schema.prisma
          npm test --if-present

      - name: Frontend install and audits
        working-directory: frontend
        run: |
          npm ci
          npx expo install --check
          node scripts/i18n-audit.mjs
          node scripts/release-audit.mjs

      - name: Commit consolidated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/App.js frontend/AppKitConfig.js backend/src/server.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Consolidate real-device production hardening"
          git pull --rebase origin main
          git push origin HEAD:main
