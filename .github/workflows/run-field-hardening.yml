              s,
              "  const formatCurrency = (usdValue) =>\n  v26FormatCurrency(usdValue, selectedCurrency);",
              "  const formatCurrency = (usdValue) =>\n  v26FormatCurrency(usdValue, selectedCurrency, liveExchangeRates);",
              'formatCurrency live rates'
          )

