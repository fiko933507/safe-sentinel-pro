name: Fix TRON Latest Block

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/fix-tron-latest-block.cjs'
      - '.github/workflows/fix-tron-latest-block.yml'

permissions:
  contents: write

jobs:
  patch-tron-latest-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply TRON latest-block patch
        run: node .github/scripts/fix-tron-latest-block.cjs

      - name: Commit patched backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/adapters/tron.js
          git diff --cached --quiet && exit 0
          git commit -m "Expose live TRON latest block"
          git push origin main
