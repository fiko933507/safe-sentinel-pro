name: Safe Sentinel Global Scam Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-scam-intelligence.yml'
      - 'backend/scripts/sync-global-scam-intelligence.mjs'
      - 'backend/scripts/sync-graphsense-risk-intelligence.mjs'
      - 'backend/package.json'

permissions:
  contents: read

concurrency:
  group: safe-sentinel-global-scam-intelligence
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.SCAM_DATABASE_URL || secrets.DATABASE_URL }}
      SCAM_FEED_URLS: ${{ secrets.SCAM_FEED_URLS }}
      SCAM_IMPORT_BATCH_SIZE: '25'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate --schema ./schema.prisma

      - name: Verify production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::SCAM_DATABASE_URL/DATABASE_URL is not configured. Scam feed sync was skipped safely."
            exit 0
          fi

      - name: Sync core global scam intelligence
        if: ${{ env.DATABASE_URL != '' }}
        working-directory: backend
        run: npm run scam:sync

      - name: Sync GraphSense risk intelligence
        if: ${{ env.DATABASE_URL != '' }}
        working-directory: backend
        run: node scripts/sync-graphsense-risk-intelligence.mjs
