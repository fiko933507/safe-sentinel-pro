name: Safe Sentinel Private Beta Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-beta-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply private beta UX and login performance fixes
        run: python3 scripts/private-beta-hardening.py

      - name: Verify patched source parses
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          node -e "require('@babel/core').transformFileSync('App.js',{configFile:'./babel.config.js'}); console.log('BABEL PARSE PASSED')"

      - name: Commit hardened source
        shell: bash
        run: |
          if git diff --quiet -- frontend/App.js; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/App.js
          git commit -m 'fix(app): faster login, branded profile and private beta access'
          git push origin HEAD:main
