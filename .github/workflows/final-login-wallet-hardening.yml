name: Final Login and Wallet Hardening

on:
  push:
    paths:
      - '.github/workflows/final-login-wallet-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply login resilience and wallet connect UX
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend/App.js')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label, required=True):
              global s
              if old not in s:
                  if required:
                      raise SystemExit(f'{label}: anchor not found')
                  print(f'{label}: already applied or anchor absent')
                  return False
              s = s.replace(old, new, 1)
              print(f'{label}: applied')
              return True

          # Shared resilient auth request helper: 30s timeout, one wake/retry pass.
          if 'const requestWithBackendRecovery = async (requestFactory)' not in s:
              anchor = '  const handleLogin = async () => {\n'
              helper = '''  const requestWithBackendRecovery = async (requestFactory) => {\n    try {\n      return await requestFactory();\n    } catch (firstError) {\n      const status = firstError?.response?.status;\n      const retryable =\n        !firstError?.response ||\n        firstError?.code === 'ECONNABORTED' ||\n        [502, 503, 504].includes(status);\n\n      if (!retryable) throw firstError;\n\n      try {\n        await axios.get(`${API_BASE_URL}/health`, { timeout: 20000 });\n      } catch (_) {}\n\n      await new Promise((resolve) => setTimeout(resolve, 1200));\n      return await requestFactory();\n    }\n  };\n\n  const handleLogin = async () => {\n'''
              replace_once(anchor, helper, 'auth-recovery-helper')

          login_pattern = re.compile(r'''  const handleLogin = async \(\) => \{[\s\S]*?\n  const handleCompleteRegistration = async \(\) => \{''')
          login_replacement = '''  const handleLogin = async () => {\n    const cleanEmail = SecurityScannerMiddleware.sanitizeInput(email).trim().toLowerCase();\n    const cleanPassword = password.trim();\n\n    if (!cleanEmail || !cleanPassword) {\n      Alert.alert(\n        t("runtimeMissingInfoTitle"),\n        selectedLanguage === 'tr' ? 'Lütfen e-posta ve şifrenizi girin.' : 'Enter your email and password.'\n      );\n      return;\n    }\n\n    try {\n      setLoading(true);\n\n      const response = await requestWithBackendRecovery(() =>\n        axios.post(\n          `${API_BASE_URL}/api/auth/login`,\n          { email: cleanEmail, password: cleanPassword },\n          {\n            headers: { ...SecurityScannerMiddleware.auditHeaders },\n            timeout: 30000\n          }\n        )\n      );\n\n      const { token, user } = response.data || {};\n      if (!token || !user) {\n        throw new Error('INVALID_LOGIN_RESPONSE');\n      }\n\n      setToken(token);\n      if (Platform.OS === 'web') {\n        await AsyncStorage.setItem('user_secure_token', token);\n      } else {\n        await SecureStore.setItemAsync('user_secure_token', token);\n      }\n\n      setName(user.name || '');\n      setEmail(user.email || cleanEmail);\n      setUserStatus(user.status || 'free');\n      setQueryCount(0);\n      setApiOnline(true);\n      setCurrentScreen('dashboard');\n      setActiveModule('dashboard');\n\n      Alert.alert(\n        t("runtimeLoginSuccessTitle"),\n        selectedLanguage === 'tr'\n          ? `Hoş geldiniz ${user.name || ''}!`\n          : `Welcome ${user.name || ''}!`\n      );\n    } catch (error) {\n      console.error('Login error:', error);\n      const status = error?.response?.status;\n      const code = error?.code;\n      const serverMessage = error?.response?.data?.error || error?.response?.data?.message;\n\n      const message = status === 401\n        ? (selectedLanguage === 'tr' ? 'E-posta veya şifre hatalı.' : 'Incorrect email or password.')\n        : status === 429\n        ? (selectedLanguage === 'tr' ? 'Çok fazla giriş denemesi yapıldı. Kısa bir süre sonra tekrar deneyin.' : 'Too many login attempts. Please try again shortly.')\n        : [502, 503, 504].includes(status) || code === 'ECONNABORTED' || !error?.response\n        ? (selectedLanguage === 'tr'\n            ? 'Güvenli sunucu bağlantısı şu anda hazırlanıyor. Otomatik yeniden deneme başarısız oldu; lütfen birkaç saniye sonra tekrar deneyin.'\n            : 'The secure server connection is still starting. Automatic retry did not complete; please try again in a few seconds.')\n        : serverMessage || t("runtimeLoginFailedGeneric");\n\n      Alert.alert(t("runtimeLoginFailedTitle"), message);\n    } finally {\n      setLoading(false);\n    }\n  };\n\n  const handleCompleteRegistration = async () => {'''
          s2, n = login_pattern.subn(login_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'login function replacement failed: {n}')
          s = s2
          print('login-flow: applied')

          # Make registration use the same recovery behavior and 30s timeout.
          s = s.replace(
              "const response = await axios.post(\n        `${API_BASE_URL}/api/auth/register`,",
              "const response = await requestWithBackendRecovery(() => axios.post(\n        `${API_BASE_URL}/api/auth/register`,",
              1
          )
          reg_timeout_anchor = "          timeout: 10000\n        }\n      );\n\n      const { token, user } = response.data;"
          reg_timeout_new = "          timeout: 30000\n        }\n      ));\n\n      const { token, user } = response.data;"
          if reg_timeout_anchor in s:
              s = s.replace(reg_timeout_anchor, reg_timeout_new, 1)
              print('registration-retry: applied')
          else:
              print('registration-retry: timeout anchor already changed or absent')

          # Wallet connection helpers. Reown/AppKit is already initialized by AppKitProvider.
          if 'const handleOpenWalletConnection = async () =>' not in s:
              wallet_anchor = '  const handleVipSelection = () => {\n'
              wallet_helpers = '''  const handleOpenWalletConnection = async () => {\n    try {\n      await appKit.open();\n    } catch (error) {\n      console.error('[WALLET CONNECT]', error);\n      Alert.alert(\n        selectedLanguage === 'tr' ? 'Cüzdan Bağlantısı' : 'Wallet Connection',\n        selectedLanguage === 'tr'\n          ? 'Cüzdan bağlantı ekranı açılamadı. Lütfen tekrar deneyin.'\n          : 'Wallet connection could not be opened. Please try again.'\n      );\n    }\n  };\n\n  const applyConnectedWalletToScanner = () => {\n    const connected = String(connectedWalletAddress || '').trim();\n    if (!isConnected || !connected) {\n      handleOpenWalletConnection();\n      return;\n    }\n\n    const chainToNetwork = {\n      1: 'eth',\n      56: 'bsc',\n      137: 'polygon',\n      42161: 'arb',\n      43114: 'avax'\n    };\n\n    setAddress(connected);\n    if (chainToNetwork[Number(chainId)]) {\n      setSelectedNetwork(chainToNetwork[Number(chainId)]);\n    }\n    setQueryWarning('');\n  };\n\n  const shortenWalletAddress = (value) => {\n    const text = String(value || '').trim();\n    if (text.length <= 14) return text;\n    return `${text.slice(0, 7)}…${text.slice(-5)}`;\n  };\n\n  const handleVipSelection = () => {\n'''
              replace_once(wallet_anchor, wallet_helpers, 'wallet-connect-helpers')

          # Dashboard wallet card, between compact top nav and profile dropdown.
          if 'SAFE_SENTINEL_CONNECTED_WALLET_CARD' not in s:
              card_anchor = "    </View>\n    {profileMenuOpen ?\n"
              wallet_card = '''    </View>\n    {/* SAFE_SENTINEL_CONNECTED_WALLET_CARD */}\n    <View style={{\n      backgroundColor: theme.itemBg,\n      borderColor: isConnected ? '#10B981' : theme.borderCol,\n      borderWidth: 1,\n      borderRadius: 12,\n      padding: 11,\n      marginBottom: 10\n    }}>\n      <View style={{ flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between' }}>\n        <View style={{ flex: 1, paddingRight: 10 }}>\n          <Text style={{ color: theme.textMain, fontSize: 11, fontWeight: '900' }}>\n            {selectedLanguage === 'tr' ? 'Web3 Cüzdanı' : 'Web3 Wallet'}\n          </Text>\n          <Text style={{ color: isConnected ? '#10B981' : theme.textSub, fontSize: 9, marginTop: 3, fontWeight: '700' }}>\n            {isConnected && connectedWalletAddress\n              ? `${shortenWalletAddress(connectedWalletAddress)}  •  ${selectedLanguage === 'tr' ? 'Bağlı' : 'Connected'}`\n              : (selectedLanguage === 'tr' ? 'Henüz cüzdan bağlı değil' : 'No wallet connected')}\n          </Text>\n          {isConnected && chainId ?\n            <Text style={{ color: theme.textSub, fontSize: 8, marginTop: 3 }}>Chain ID: {String(chainId)}</Text> : null}\n        </View>\n        <TouchableOpacity\n          onPress={handleOpenWalletConnection}\n          activeOpacity={0.84}\n          style={{\n            backgroundColor: isConnected ? theme.inputBg : theme.primary,\n            borderRadius: 9,\n            paddingHorizontal: 12,\n            paddingVertical: 9,\n            borderWidth: isConnected ? 1 : 0,\n            borderColor: theme.borderCol\n          }}>\n          <Text style={{ color: isConnected ? theme.primary : '#FFFFFF', fontSize: 9, fontWeight: '900' }}>\n            {isConnected\n              ? (selectedLanguage === 'tr' ? 'YÖNET' : 'MANAGE')\n              : (selectedLanguage === 'tr' ? 'CÜZDAN BAĞLA' : 'CONNECT WALLET')}\n          </Text>\n        </TouchableOpacity>\n      </View>\n      {isConnected && connectedWalletAddress ?\n        <TouchableOpacity\n          onPress={applyConnectedWalletToScanner}\n          activeOpacity={0.84}\n          style={{\n            marginTop: 9,\n            borderTopWidth: 1,\n            borderTopColor: theme.borderCol,\n            paddingTop: 9\n          }}>\n          <Text style={{ color: theme.primary, fontSize: 9, fontWeight: '900', textAlign: 'center' }}>\n            {selectedLanguage === 'tr' ? 'BAĞLI CÜZDANI TARAMA ALANINA AKTAR' : 'USE CONNECTED WALLET FOR SCAN'}\n          </Text>\n        </TouchableOpacity> : null}\n    </View>\n    {profileMenuOpen ?\n'''
              replace_once(card_anchor, wallet_card, 'dashboard-wallet-card')

          # Scanner quick-use hint when a wallet is connected.
          scanner_anchor = "              <TextInput\n"
          if 'USE_CONNECTED_WALLET_INLINE' not in s:
              # Insert only near the first dashboard wallet-address input by anchoring on its label.
              target = "              <Text style={{ color: theme.textMain, fontSize: 10, fontWeight: '700', marginBottom: 5 }}>{t(\"dashboardWalletAddress\")}</Text>\n"
              inline = target + '''              {/* USE_CONNECTED_WALLET_INLINE */}\n              {isConnected && connectedWalletAddress ?\n                <TouchableOpacity onPress={applyConnectedWalletToScanner} style={{ marginBottom: 6 }}>\n                  <Text style={{ color: '#10B981', fontSize: 8, fontWeight: '800' }}>\n                    {selectedLanguage === 'tr'\n                      ? `Bağlı cüzdanı kullan: ${shortenWalletAddress(connectedWalletAddress)}`\n                      : `Use connected wallet: ${shortenWalletAddress(connectedWalletAddress)}`}\n                  </Text>\n                </TouchableOpacity> : null}\n'''
              if target in s:
                  s = s.replace(target, inline, 1)
                  print('scanner-wallet-shortcut: applied')
              else:
                  print('scanner-wallet-shortcut: dashboard label anchor absent')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Frontend syntax and audits
        run: |
          cd frontend
          npm ci
          node --check App.js
          npm test

      - name: Commit hardened frontend
        run: |
          if git diff --quiet -- frontend/App.js; then
            echo "No App.js changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/App.js
          git commit -m "Harden login recovery and add wallet connect UX"
          git push
