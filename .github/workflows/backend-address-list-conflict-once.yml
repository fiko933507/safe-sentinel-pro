name: Backend Address List Conflict Hardening Once

on:
  push:
    paths:
      - '.github/workflows/backend-address-list-conflict-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add backend conflict guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/src/server.js')
          s=p.read_text(encoding='utf-8')

          white_anchor="""    try{\n      const row=await db.whitelistAddress.create({\n"""
          white_new="""    try{\n      const conflictingBlacklist = await db.blacklistAddress.findFirst({\n        where:{ userId:req.user.id, network, address }\n      });\n\n      if(conflictingBlacklist){\n        await createAddressListEvent(req,req.user.id,'WHITELIST_ADD',false,{reason:'BLACKLIST_CONFLICT',network,address});\n        return res.status(409).json({\n          success:false,\n          error:'Address is already present in blacklist. Remove it from blacklist before adding to whitelist.'\n        });\n      }\n\n      const row=await db.whitelistAddress.create({\n"""
          if white_anchor not in s:
              raise SystemExit('whitelist anchor not found')
          s=s.replace(white_anchor,white_new,1)

          black_anchor="""    try{\n      const row=await db.blacklistAddress.create({\n"""
          black_new="""    try{\n      const conflictingWhitelist = await db.whitelistAddress.findFirst({\n        where:{ userId:req.user.id, network, address }\n      });\n\n      if(conflictingWhitelist){\n        await createAddressListEvent(req,req.user.id,'BLACKLIST_ADD',false,{reason:'WHITELIST_CONFLICT',network,address});\n        return res.status(409).json({\n          success:false,\n          error:'Address is already present in whitelist. Remove it from whitelist before adding to blacklist.'\n        });\n      }\n\n      const row=await db.blacklistAddress.create({\n"""
          if black_anchor not in s:
              raise SystemExit('blacklist anchor not found')
          s=s.replace(black_anchor,black_new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate backend
        working-directory: backend
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run prisma:generate
          npx prisma validate
          node --check src/server.js
          node --check src/security-v2.js
      - name: Commit and self-clean
        run: |
          rm -f .github/workflows/backend-address-list-conflict-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/server.js .github/workflows/backend-address-list-conflict-once.yml
          git commit -m 'Enforce whitelist and blacklist exclusivity in backend'
          git push
