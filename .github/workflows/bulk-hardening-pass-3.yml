name: Bulk Production Hardening Pass 3

on:
  push:
    paths:
      - '.github/workflows/bulk-hardening-pass-3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-security-lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply whitelist and blacklist consistency fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend/App.js')
          s = p.read_text(encoding='utf-8')

          old = '''  const removeFromWhitelist = async (addr) => {
    try {
      const cleanAddr = SecurityScannerMiddleware.sanitizeInput(addr || "");

      if (!cleanAddr) {
        Alert.alert(t('commonErrorTitle'), t('commonInvalidAddress'));
        return;
      }

      const updated = whitelist.filter(
        (item) => String(item).trim() !== cleanAddr.trim()
      );

      if (updated.length === whitelist.length) {
        Alert.alert(t('commonInfoTitle'), t('whitelistNotFound'));
        return;
      }

      setWhitelist(updated);
      await saveWhitelist(updated);

      Alert.alert(t('commonSuccessTitle'), t('whitelistRemoved'));
    } catch (e) {
      handleIsolatedError("Whitelist Silme", e);
    }
  };

  const removeFromBlacklist = async (addr) => {
    try {
      const cleanAddr = SecurityScannerMiddleware.sanitizeInput(addr || "");

      if (!cleanAddr) {
        Alert.alert(t('commonErrorTitle'), t('commonInvalidAddress'));
        return;
      }

      const updated = blacklist.filter(
        (item) => String(item).trim() !== cleanAddr.trim()
      );

      if (updated.length === blacklist.length) {
        Alert.alert(t('commonInfoTitle'), t('blacklistNotFound'));
        return;
      }

      setBlacklist(updated);
      await saveBlacklist(updated);

      Alert.alert(t('commonSuccessTitle'), t('blacklistRemoved'));
    } catch (e) {
      handleIsolatedError("Blacklist Silme", e);
    }
  };
  const addToWhitelist = () => {
    const cleanAddr = address ? SecurityScannerMiddleware.sanitizeInput(address) : "";
    if (!cleanAddr) return Alert.alert(t('commonErrorTitle'), t('commonAddressRequired'));
    if (blacklist.includes(cleanAddr)) {
      return Alert.alert(t('commonConflictTitle'), t('whitelistConflict'));
    }
    if (whitelist.includes(cleanAddr)) return Alert.alert(t('commonInfoTitle'), t('whitelistAlready'));

    const updated = [...whitelist, cleanAddr];
    saveWhitelist(updated);
    Alert.alert(t('commonSuccessTitle'), t('whitelistAdded'));
  };

  const addToBlacklist = () => {
    const cleanAddr = address ? SecurityScannerMiddleware.sanitizeInput(address) : "";
    if (!cleanAddr) return Alert.alert(t('commonErrorTitle'), t('commonAddressRequired'));
    if (whitelist.includes(cleanAddr)) {
      return Alert.alert(t('commonConflictTitle'), t('blacklistConflict'));
    }
    if (blacklist.includes(cleanAddr)) return Alert.alert(t('commonInfoTitle'), t('blacklistAlready'));

    const updated = [...blacklist, cleanAddr];
    saveBlacklist(updated);
    Alert.alert(t('commonSuccessTitle'), t('blacklistRiskAdded'));
  };
'''

          new = '''  const removeFromWhitelist = async (entry) => {
    try {
      const entryAddress = String(entry?.address || entry || '').trim();
      const cleanAddr = SecurityScannerMiddleware.sanitizeInput(entryAddress);
      if (!cleanAddr) {
        Alert.alert(t('commonErrorTitle'), t('commonInvalidAddress'));
        return;
      }

      const matched = whitelist.find((item) => {
        const itemAddress = String(item?.address || item || '').trim();
        return itemAddress.toLowerCase() === cleanAddr.toLowerCase();
      });

      if (!matched) {
        Alert.alert(t('commonInfoTitle'), t('whitelistNotFound'));
        return;
      }

      if (matched?.id) {
        await api.delete(`/api/whitelist/${matched.id}`);
        await syncSecurityAddressLists();
      } else {
        const updated = whitelist.filter((item) => {
          const itemAddress = String(item?.address || item || '').trim();
          return itemAddress.toLowerCase() !== cleanAddr.toLowerCase();
        });
        setWhitelist(updated);
        await AsyncStorage.setItem('@whitelist', JSON.stringify(updated));
      }

      Alert.alert(t('commonSuccessTitle'), t('whitelistRemoved'));
    } catch (e) {
      handleIsolatedError("Whitelist Silme", e);
      Alert.alert(t('commonErrorTitle'), selectedLanguage === 'tr' ? 'Whitelist kaydı kaldırılamadı.' : 'Whitelist entry could not be removed.');
    }
  };

  const removeFromBlacklist = async (entry) => {
    try {
      const entryAddress = String(entry?.address || entry || '').trim();
      const cleanAddr = SecurityScannerMiddleware.sanitizeInput(entryAddress);
      if (!cleanAddr) {
        Alert.alert(t('commonErrorTitle'), t('commonInvalidAddress'));
        return;
      }

      const matched = blacklist.find((item) => {
        const itemAddress = String(item?.address || item || '').trim();
        return itemAddress.toLowerCase() === cleanAddr.toLowerCase();
      });

      if (!matched) {
        Alert.alert(t('commonInfoTitle'), t('blacklistNotFound'));
        return;
      }

      if (matched?.id) {
        await api.delete(`/api/blacklist/${matched.id}`);
        await syncSecurityAddressLists();
      } else {
        const updated = blacklist.filter((item) => {
          const itemAddress = String(item?.address || item || '').trim();
          return itemAddress.toLowerCase() !== cleanAddr.toLowerCase();
        });
        setBlacklist(updated);
        await AsyncStorage.setItem('@blacklist', JSON.stringify(updated));
      }

      Alert.alert(t('commonSuccessTitle'), t('blacklistRemoved'));
    } catch (e) {
      handleIsolatedError("Blacklist Silme", e);
      Alert.alert(t('commonErrorTitle'), selectedLanguage === 'tr' ? 'Blacklist kaydı kaldırılamadı.' : 'Blacklist entry could not be removed.');
    }
  };

  const addToWhitelist = async () => {
    const cleanAddr = address ? SecurityScannerMiddleware.sanitizeInput(address) : "";
    if (!cleanAddr) return Alert.alert(t('commonErrorTitle'), t('commonAddressRequired'));
    if (securityListContains(blacklist, cleanAddr, selectedNetwork)) {
      return Alert.alert(t('commonConflictTitle'), t('whitelistConflict'));
    }
    if (securityListContains(whitelist, cleanAddr, selectedNetwork)) {
      return Alert.alert(t('commonInfoTitle'), t('whitelistAlready'));
    }

    try {
      await saveWhitelist([...whitelist, { address: cleanAddr, network: selectedNetwork === 'eth' ? 'ethereum' : selectedNetwork }]);
      await syncSecurityAddressLists();
      Alert.alert(t('commonSuccessTitle'), t('whitelistAdded'));
    } catch (e) {
      handleIsolatedError('Whitelist Ekleme', e);
    }
  };

  const addToBlacklist = async () => {
    const cleanAddr = address ? SecurityScannerMiddleware.sanitizeInput(address) : "";
    if (!cleanAddr) return Alert.alert(t('commonErrorTitle'), t('commonAddressRequired'));
    if (securityListContains(whitelist, cleanAddr, selectedNetwork)) {
      return Alert.alert(t('commonConflictTitle'), t('blacklistConflict'));
    }
    if (securityListContains(blacklist, cleanAddr, selectedNetwork)) {
      return Alert.alert(t('commonInfoTitle'), t('blacklistAlready'));
    }

    try {
      await saveBlacklist([...blacklist, { address: cleanAddr, network: selectedNetwork === 'eth' ? 'ethereum' : selectedNetwork }]);
      await syncSecurityAddressLists();
      Alert.alert(t('commonSuccessTitle'), t('blacklistRiskAdded'));
    } catch (e) {
      handleIsolatedError('Blacklist Ekleme', e);
    }
  };
'''

          if old not in s:
              raise SystemExit('security list handler anchor not found')
          s = s.replace(old, new, 1)

          # Render object-backed canonical list entries correctly.
          s = s.replace('{addr}\n                      </Text>', "{String(addr?.address || addr || '')}\n                      </Text>")
          s = s.replace('onPress={() => removeFromWhitelist(addr)}', 'onPress={() => removeFromWhitelist(addr)}')
          s = s.replace('onPress={() => removeFromBlacklist(addr)}', 'onPress={() => removeFromBlacklist(addr)}')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check frontend/App.js
      - name: Commit security list hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/App.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix whitelist blacklist conflicts and persistence"
          git push origin HEAD:main
