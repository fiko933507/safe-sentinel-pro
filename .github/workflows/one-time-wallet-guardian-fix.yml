name: One-time Wallet Guardian UX Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-wallet-guardian-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_BACKEND_URL: https://safe-sentinel-pro-1.onrender.com
      EXPO_PUBLIC_PLAY_STORE_BUILD: 'false'
      EXPO_PUBLIC_REOWN_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_REOWN_PROJECT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: release.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch login Vault Inheritance and Guardian flows
        run: python .github/scripts/patch-wallet-guardian.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Frontend release audit
        working-directory: frontend
        run: npm test

      - name: Babel parse patched App
        working-directory: frontend
        run: node -e "require('@babel/core').transformFileSync('App.js',{configFile:'./babel.config.js'}); console.log('BABEL PARSE PASSED')"

      - name: Expo compatibility
        working-directory: frontend
        run: |
          npx expo install --check
          npx --yes expo-doctor@1.20.4

      - name: Production backend health smoke
        shell: bash
        run: |
          for i in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 https://safe-sentinel-pro-1.onrender.com/health >/tmp/health.json; then
              cat /tmp/health.json
              echo 'Production backend health: PASS'
              exit 0
            fi
            echo "Backend is redeploying; health retry $i/18"
            sleep 5
          done
          echo '::error::Production backend did not become healthy'
          exit 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore release keystore
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          chmod 600 android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        working-directory: frontend
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify and stage APK
        working-directory: frontend
        run: |
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" safe-sentinel-wallet-guardian-fixed.apk
          sha256sum safe-sentinel-wallet-guardian-fixed.apk > safe-sentinel-wallet-guardian-fixed.sha256

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: safe-sentinel-wallet-guardian-fixed-${{ github.run_id }}
          path: |
            frontend/safe-sentinel-wallet-guardian-fixed.apk
            frontend/safe-sentinel-wallet-guardian-fixed.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit patched source and clean one-time files
        run: |
          rm -f frontend/android/app/release.keystore
          rm -f .github/workflows/one-time-wallet-guardian-fix.yml
          rm -f .github/scripts/patch-wallet-guardian.py
          git config user.name 'safe-sentinel-release-bot'
          git config user.email 'safe-sentinel-release-bot@users.noreply.github.com'
          git add frontend/App.js .github/workflows/one-time-wallet-guardian-fix.yml .github/scripts/patch-wallet-guardian.py
          git diff --cached --check
          git commit -m 'fix(app): connect Vault inheritance and Guardian wallet flows'
          git push origin HEAD:main

# Final retry uses a bounded health loop so a Render rolling restart is not mistaken for an application failure.
