name: Safe Sentinel Scam Address DB Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/scripts/audit-scam-addresses.mjs'
      - '.github/workflows/scam-address-db-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.SCAM_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate --schema ./schema.prisma
      - name: Audit production ScamAddress table
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::SCAM_DATABASE_URL/DATABASE_URL is not configured"
            exit 1
          fi
          node scripts/audit-scam-addresses.mjs
