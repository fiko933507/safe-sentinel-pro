name: Fix password policy v7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-password-policy-v7.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply password policy
        shell: python
        run: |
          from pathlib import Path

          app = Path('frontend/App.js')
          text = app.read_text(encoding='utf-8')
          replacements = {
              'runtimeInvalidPasswordMessage: "\\u015Eifreniz en az 10 karakter olmal\\u0131d\\u0131r."': 'runtimeInvalidPasswordMessage: "\\u015Eifreniz en az 6 karakter olmal\\u0131 ve en az 1 b\\xFCy\\xFCk harf i\\xE7ermelidir."',
              'runtimeInvalidPasswordMessage: "Your password must be at least 10 characters long."': 'runtimeInvalidPasswordMessage: "Your password must be at least 6 characters long and contain at least 1 uppercase letter."',
              'if (cleanPassword.length < 10) {': 'if (cleanPassword.length < 6 || !/[A-Z\\u00C7\\u011E\\u0130\\u00D6\\u015E\\u00DC]/.test(cleanPassword)) {',
              "'Kayıt bilgilerini kontrol edin. Şifre en az 10 karakter olmalıdır.'": "'Kayıt bilgilerini kontrol edin. Şifre en az 6 karakter olmalı ve en az 1 büyük harf içermelidir.'",
              "'Check your registration details. The password must be at least 10 characters.'": "'Check your registration details. The password must be at least 6 characters and contain at least 1 uppercase letter.'",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'App.js expected exactly 1 match, found {count}: {old}')
              text = text.replace(old, new)
          app.write_text(text, encoding='utf-8')

          server = Path('backend/src/server.js')
          text = server.read_text(encoding='utf-8')
          old = "password:z.string().min(10).max(128)"
          new = "password:z.string().min(6).max(128).regex(/[A-ZÇĞİÖŞÜ]/,'Password must contain at least one uppercase letter')"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'server.js expected exactly 1 password schema match, found {count}')
          server.write_text(text.replace(old, new), encoding='utf-8')

          gradle = Path('frontend/android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          old = 'versionCode 6'
          new = 'versionCode 7'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'build.gradle expected exactly 1 versionCode 6, found {count}')
          gradle.write_text(text.replace(old, new), encoding='utf-8')

          release = Path('.github/workflows/play-store-production-aab.yml')
          text = release.read_text(encoding='utf-8')
          replacements = {
              "versionCode[[:space:]]+6": "versionCode[[:space:]]+7",
              "versionCode 6": "versionCode 7",
              "Safe-Sentinel-v1.0.0-vc6.aab": "Safe-Sentinel-v1.0.0-vc7.aab",
              "safe-sentinel-play-store-v1.0.0-vc6-": "safe-sentinel-play-store-v1.0.0-vc7-",
              "Version code: 6": "Version code: 7",
              "Version: 1.0.0 (6)": "Version: 1.0.0 (7)",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          release.write_text(text, encoding='utf-8')

      - name: Validate source policy
        shell: bash
        run: |
          node --check frontend/App.js
          node --check backend/src/server.js
          grep -Fq "cleanPassword.length < 6" frontend/App.js
          grep -Fq "contain at least 1 uppercase letter" frontend/App.js
          grep -Fq "min(6).max(128).regex(/[A-ZÇĞİÖŞÜ]/" backend/src/server.js
          grep -Eq 'versionCode[[:space:]]+7' frontend/android/app/build.gradle
          if grep -Fq 'password:z.string().min(10)' backend/src/server.js; then exit 1; fi
          if grep -Fq 'cleanPassword.length < 10' frontend/App.js; then exit 1; fi

      - name: Backend tests
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Frontend syntax and Expo compatibility
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx expo install --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'safe-sentinel-release-bot'
          git config user.email 'safe-sentinel-release-bot@users.noreply.github.com'
          git add frontend/App.js backend/src/server.js frontend/android/app/build.gradle .github/workflows/play-store-production-aab.yml
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix(auth): require 6 chars and one uppercase letter'
          git push
