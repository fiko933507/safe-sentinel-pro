name: Fix password policy v7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-password-policy-v7.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply password policy and precise registration errors
        shell: python
        run: |
          from pathlib import Path

          app = Path('frontend/App.js')
          text = app.read_text(encoding='utf-8')
          replacements = {
              'runtimeInvalidPasswordMessage: "\\u015Eifreniz en az 10 karakter olmal\\u0131d\\u0131r."': 'runtimeInvalidPasswordMessage: "\\u015Eifreniz en az 6 karakter olmal\\u0131 ve en az 1 b\\xFCy\\xFCk harf i\\xE7ermelidir."',
              'runtimeInvalidPasswordMessage: "Your password must be at least 10 characters long."': 'runtimeInvalidPasswordMessage: "Your password must be at least 6 characters long and contain at least 1 uppercase letter."',
              'if (cleanPassword.length < 10) {': 'if (cleanPassword.length < 6 || !/[A-Z\\u00C7\\u011E\\u0130\\u00D6\\u015E\\u00DC]/.test(cleanPassword)) {',
              'const serverMessage = error?.response?.data?.error || error?.response?.data?.message;': "const serverData = error?.response?.data || {};\n      const serverMessage = serverData.error || serverData.message;\n      const invalidField = String(serverData.field || '').toLowerCase();",
              ": status === 400\n        ? (selectedLanguage === 'tr' ? 'Kayıt bilgilerini kontrol edin. Şifre en az 10 karakter olmalıdır.' : 'Check your registration details. The password must be at least 10 characters.')": ": status === 400\n        ? invalidField === 'email'\n          ? (selectedLanguage === 'tr' ? 'Geçerli bir e-posta adresi girin.' : 'Enter a valid email address.')\n          : invalidField === 'password'\n          ? (selectedLanguage === 'tr' ? 'Şifre en az 6 karakter olmalı ve en az 1 büyük harf içermelidir.' : 'The password must be at least 6 characters and contain at least 1 uppercase letter.')\n          : invalidField === 'name'\n          ? (selectedLanguage === 'tr' ? 'Ad ve soyad bilgisini kontrol edin.' : 'Check the first and last name.')\n          : (selectedLanguage === 'tr' ? 'Kayıt bilgilerini kontrol edin.' : 'Check your registration details.')",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'App.js expected exactly 1 match, found {count}: {old}')
              text = text.replace(old, new)
          app.write_text(text, encoding='utf-8')

          server = Path('backend/src/server.js')
          text = server.read_text(encoding='utf-8')
          old = "const p=z.object({name:z.string().min(2).max(80),email:z.string().email(),password:z.string().min(10).max(128)}).safeParse(req.body); if(!p.success)return res.status(400).json({error:'Invalid input'});"
          new = "const p=z.object({name:z.string().min(2).max(80),email:z.string().email(),password:z.string().min(6).max(128).regex(/[A-ZÇĞİÖŞÜ]/,'Password must contain at least one uppercase letter')}).safeParse(req.body); if(!p.success){const issue=p.error.issues?.[0]; const field=String(issue?.path?.[0]||'input'); return res.status(400).json({error:'Invalid input',field,message:issue?.message||'Invalid input'});}"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'server.js expected exactly 1 register validation match, found {count}')
          server.write_text(text.replace(old, new), encoding='utf-8')

          gradle = Path('frontend/android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          old = 'versionCode 6'
          new = 'versionCode 7'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'build.gradle expected exactly 1 versionCode 6, found {count}')
          gradle.write_text(text.replace(old, new), encoding='utf-8')

      - name: Validate source policy
        shell: bash
        run: |
          node --check frontend/App.js
          node --check backend/src/server.js
          grep -Fq "cleanPassword.length < 6" frontend/App.js
          grep -Fq "invalidField === 'password'" frontend/App.js
          grep -Fq "min(6).max(128).regex(/[A-ZÇĞİÖŞÜ]/" backend/src/server.js
          grep -Fq "field,message:issue?.message" backend/src/server.js
          grep -Eq 'versionCode[[:space:]]+7' frontend/android/app/build.gradle
          if grep -Fq 'password:z.string().min(10)' backend/src/server.js; then exit 1; fi
          if grep -Fq 'cleanPassword.length < 10' frontend/App.js; then exit 1; fi

      - name: Backend dependency and syntax validation
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          node --check src/server.js
          npx prisma generate --schema ./schema.prisma

      - name: Frontend syntax and Expo compatibility
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          node --check App.js
          npx expo install --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'safe-sentinel-release-bot'
          git config user.email 'safe-sentinel-release-bot@users.noreply.github.com'
          git add frontend/App.js backend/src/server.js frontend/android/app/build.gradle
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix(auth): accept 6-char passwords with uppercase and surface validation errors'
          git push
