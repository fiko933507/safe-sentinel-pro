name: Persist Play Store Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/persist-play-store-hardening.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and apply production preparation
        working-directory: frontend
        env:
          NODE_ENV: production
          EXPO_PUBLIC_BACKEND_URL: https://safe-sentinel-pro-1.onrender.com
          EXPO_PUBLIC_PLAY_STORE_BUILD: 'true'
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify persisted production markers
        working-directory: frontend
        shell: bash
        run: |
          grep -Fq 'attempts = 2' App.js
          grep -Fq 'timeout: 12000' App.js
          grep -Fq 'normalizeBackendNetwork' App.js
          grep -Fq 'EXPO_PUBLIC_VIP_MONTHLY_USDT || 100' App.js
          grep -Fq 'EXPO_PUBLIC_VIP_YEARLY_USDT || 1000' App.js
          grep -Fq "api.get('/api/live-prices'" App.js
          if grep -Fq "axios.get('https://api.coingecko.com/api/v3/simple/price'" App.js; then
            echo '::error::Direct mobile CoinGecko call still present'
            exit 1
          fi
          node -e "require('@babel/core').transformFileSync('App.js',{configFile:'./babel.config.js'}); console.log('BABEL PARSE PASSED')"
          npx expo install --check
      - name: Persist source and launcher assets, then remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/persist-play-store-hardening.yml
          git config user.name 'safe-sentinel-release-bot'
          git config user.email 'safe-sentinel-release-bot@users.noreply.github.com'
          git add -A frontend/App.js frontend/android/app/src/main/res .github/workflows/persist-play-store-hardening.yml
          if git diff --cached --quiet; then
            echo 'No source changes to persist.'
            exit 0
          fi
          git commit -m 'fix(app): persist Play Store production hardening'
          git pull --rebase origin main
          git push origin HEAD:main
