name: Apply Emergency Dashboard Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-emergency-dashboard-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace duplicate Guardian with emergency tools
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/App.js')
          text=p.read_text(encoding='utf-8')
          old='''            ["Guardian", t("dashboardSecurityCircle"), "guardianView", t("dashboardAvailable")]].'''
          new='''            [t("dashboardEmergencyAssetLock"), t("dashboardEmergencyProtectionMode"), "emergencyLockView", t("dashboardAvailable")],
            [t("dashboardCryptoInheritance"), t("dashboardEmergencySecurityDescription"), "inheritView", t("dashboardAvailable")]].'''
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one emergency Guardian row, found {count}')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          print('Emergency dashboard updated successfully.')
          print('guardian dashboard rows:', text.count('["Guardian", t("dashboardSecurityCircle"), "guardianView", t("dashboardAvailable")]'))
          print('inherit dashboard rows:', text.count('"inheritView", t("dashboardAvailable")'))
          PY
      - name: Verify expected modules remain
        run: |
          grep -q 'activeModule === '\''guardianView'\''' frontend/App.js
          grep -q 'activeModule === '\''inheritView'\''' frontend/App.js
          grep -q '"emergencyLockView"' frontend/App.js
          grep -q '"inheritView"' frontend/App.js
      - name: Commit application change
        run: |
          if git diff --quiet -- frontend/App.js; then
            echo 'No application change needed.'
            exit 0
          fi
          git config user.name 'safe-sentinel-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/App.js
          git commit -m 'Restore emergency lock and inheritance cards'
          git push origin main
